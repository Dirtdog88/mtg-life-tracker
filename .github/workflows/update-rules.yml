# Keeps rules.json in step with the latest Comprehensive Rules from Wizards of the Coast.
# Runs on the 3rd of each month and can be started by hand from the Actions tab.
name: Update Comprehensive Rules

on:
  schedule:
    - cron: '17 6 3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and convert the rules
        run: node scripts/update-rules.mjs
      - name: Commit if the rules changed
        run: |
          if git diff --quiet -- rules.json && git ls-files --error-unmatch rules.json >/dev/null 2>&1; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules.json
          git commit -m "Update Comprehensive Rules ($(node -p "require('./rules.json').effective"))"
          git push
