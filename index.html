    art('Food', '{2}, T, Sacrifice: You gain 3 life.', { sacLife: 3 }),
    art('Clue', '{2}, Sacrifice: Draw a card.'),
    art('Blood', '{1}, T, Discard a card, Sacrifice: Draw a card.'),
    art('Map', '{1}, T, Sacrifice: Target creature you control explores. Sorcery speed.'),
    art('Powerstone', "T: Add {C}. This mana can't be spent to cast nonartifact spells."),
    art('Gold', 'Sacrifice: Add one mana of any color.'),
    art('Junk', 'T, Sacrifice: Exile the top card of your library. You may play it this turn. Sorcery speed.'),
    art('Incubator', '{2}: Transform into a 0/0 Phyrexian artifact creature. Keeps its +1/+1 counters.'),
    ench('Shard', 'Enchantment — Shard', '{2}, Sacrifice: Scry 1, then draw a card.'),
    ench('Monster Role', 'Enchantment — Aura Role', 'Enchanted creature gets +1/+1 and has trample.'),
    ench('Wicked Role', 'Enchantment — Aura Role', 'Enchanted creature gets +1/+1. When this goes to a graveyard, each opponent loses 1 life.'),
    ench('Young Hero Role', 'Enchantment — Aura Role', 'Whenever enchanted creature attacks, if its toughness is 3 or less, put a +1/+1 counter on it.')
  ],
  walkers: [
    { kind: 'planeswalker', name: 'Jace', color: 'blue', types: 'Planeswalker — Jace', loyalty: 3, text: 'Copy of Jace, Cunning Castaway. Not legendary.' },
    { kind: 'planeswalker', name: 'Planeswalker', color: 'gold', types: 'Planeswalker', loyalty: 3, text: '' }
  ]
};

const edit = [null, null];        // open token editor per player: { id, scope: 'all' | 'one' }
const pickQty = [1, 1];
let uidN = 0;
const uid = () => `t${Date.now().toString(36)}${(uidN++).toString(36)}`;

function makeToken(tpl, qty) {
  return {
    id: uid(), kind: tpl.kind, name: tpl.name, color: tpl.color || 'steel', types: tpl.types || '', text: tpl.text || '',
    keywords: [...(tpl.keywords || [])], power: tpl.power || 0, toughness: tpl.toughness || 0, loyalty: tpl.loyalty || 0,
    sacLife: tpl.sacLife || 0, counters: 0, tempP: 0, tempT: 0, qty, tapped: false, sick: tpl.kind === 'creature'
  };
}
/* Anthems: static boosts that apply to every matching creature token a player controls */
const ANTHEM_PRESETS = [
  { name: 'Glorious Anthem', p: 1, t: 1, keywords: [], mode: 'all', value: '' },
  { name: 'Intangible Virtue', p: 1, t: 1, keywords: ['Vigilance'], mode: 'all', value: '' },
  { name: 'Honor of the Pure', p: 1, t: 1, keywords: [], mode: 'color', value: 'white' },
  { name: 'Tribal lord', p: 1, t: 1, keywords: [], mode: 'type', value: 'Goblin' }
];
const escRe = w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
// "Goblin" also matches "Goblins"; several words match if any one of them does
function typeMatch(text, value) {
  return value.split(/[\s,]+/).filter(Boolean).some(w =>
    new RegExp(`\\b${escRe(w.replace(/s$/i, ''))}s?\\b`, 'i').test(text));
}
function anthemApplies(a, t) {
  if (t.kind !== 'creature') return false;
  if (a.mode === 'type') return !!a.value && typeMatch(`${t.types} ${t.name}`, a.value);
  if (a.mode === 'color') return t.color === a.value;
  return true;
}
function auraFor(i, t) {
  const out = { p: 0, t: 0, kw: [] };
  state.players[i].anthems.forEach(a => {
    if (!anthemApplies(a, t)) return;
    out.p += a.p; out.t += a.t;
    a.keywords.forEach(k => { if (!out.kw.includes(k)) out.kw.push(k); });
  });
  return out;
}
const effP = (t, a) => t.power + t.counters + t.tempP + (a ? a.p : 0);
const effT = (t, a) => t.toughness + t.counters + t.tempT + (a ? a.t : 0);
const allKw = (t, a) => [...t.keywords, ...(a ? a.kw.filter(k => !t.keywords.includes(k)) : [])];
const signed = n => (n >= 0 ? '+' : '−') + Math.abs(n);
function anthSub(a) {
  const who = a.mode === 'type' ? (a.value ? `${a.value}s` : 'a creature type')
    : a.mode === 'color' ? `${(TOKEN_COLOR_NAMES[a.value] || '').toLowerCase()} creatures` : 'all creatures';
  return `${signed(a.p)}/${signed(a.t)}${a.keywords.length ? ' · ' + a.keywords.join(', ') : ''} · ${who}`;
}
const tokLabel = t => `${t.name}${t.qty > 1 ? ` ×${t.qty}` : ''}`;
function statLine(t, i) {
  if (t.kind === 'creature') {
    const c = t.counters, a = auraFor(i, t);
    return `${effP(t, a)}/${effT(t, a)}${c ? ` (${c > 0 ? '+' : ''}${c}/${c > 0 ? '+' : ''}${c} counters)` : ''}`;
  }
  return t.kind === 'planeswalker' ? `loyalty ${t.loyalty}` : '';
}
// Stacks that end up identical (say, after untapping) merge back into one card.
function sig(t) {
  return JSON.stringify([t.kind, t.name, t.color, t.types, t.text, [...t.keywords].sort(), t.power, t.toughness,
    t.loyalty, t.sacLife, t.counters, t.tempP, t.tempT, t.tapped, t.sick]);
}
function normalize(i) {
  const pl = state.players[i];
  const out = [], bySig = new Map();
  pl.tokens.forEach(t => {
    const k = sig(t), ex = bySig.get(k);
    if (ex) { ex.qty += t.qty; if (edit[i] && edit[i].id === t.id) edit[i].id = ex.id; }
    else { bySig.set(k, t); out.push(t); }
  });
  pl.tokens = out;
}
function stackOf(i) { return edit[i] ? state.players[i].tokens.find(t => t.id === edit[i].id) : null; }
// With "Just one" selected, the change splits one token off the group and the editor follows it.
function targetFor(i) {
  const list = state.players[i].tokens, s = stackOf(i);
  if (s && edit[i].scope === 'one' && s.qty > 1) {
    const c = JSON.parse(JSON.stringify(s));
    c.id = uid(); c.qty = 1; s.qty -= 1;
    list.splice(list.indexOf(s) + 1, 0, c);
    edit[i] = { id: c.id, scope: 'all' };
    return c;
  }
  return s;
}
function removeStack(i, s) { const l = state.players[i].tokens; const k = l.indexOf(s); if (k >= 0) l.splice(k, 1); }

// One undoable step per action; repeated taps on the same stepper within 2 s fold into one step and one log line.
function tokAct(i, groupKey, fn) {
  const now = Date.now();
  let entry, fresh = false;
  if (groupKey && burst && burst.p === i && burst.key === groupKey && now - burst.t < 2000 && state.log[state.log.length - 1] === burst.entry) {
    burst.t = now; entry = burst.entry;
  } else {
    pushUndo(); fresh = true;
    entry = addLog({ p: i, text: '' });
    burst = groupKey ? { p: i, key: groupKey, t: now, entry } : null;
  }
  const text = fn();
  if (text === null && fresh) { state.log.pop(); undoStack.pop(); burst = null; return; }
  if (text) entry.text = text;
  normalize(i);
  commit();
}

function createTokens(i, tpl, qty, openAfter) {
  closePicker(i);
  tokAct(i, null, () => {
    const t = makeToken(tpl, qty);
    state.players[i].tokens.push(t);
    if (openAfter) edit[i] = { id: t.id, scope: 'all' };
    return `creates ${qty} ${tpl.name} token${qty > 1 ? 's' : ''}`;
  });
  pickQty[i] = 1;
}

function clearTokens(i, btn) {
  if (!btn.classList.contains('armed')) {
    btn.classList.add('armed'); btn.textContent = 'Tap to confirm';
    setTimeout(() => { btn.classList.remove('armed'); btn.textContent = 'Clear tokens'; }, 3000);
    return;
  }
  btn.classList.remove('armed'); btn.textContent = 'Clear tokens';
  closeEditor(i);
  tokAct(i, null, () => { state.players[i].tokens = []; return 'clears all tokens'; });
}

/* Deck kits: a saved set of tokens and anthems per deck, shown first in the picker */
const KITS_KEY = 'mtg-duel-kits-v1';
let kits = (() => { try { return JSON.parse(localStorage.getItem(KITS_KEY)) || []; } catch (e) { return []; } })();
function saveKits() { try { localStorage.setItem(KITS_KEY, JSON.stringify(kits)); } catch (e) { /* ignore */ } }
const kitOf = i => kits.find(k => k.id === state.players[i].kit) || null;
const pickUi = [{ naming: null }, { naming: null }];
const tokTemplate = s => ({ kind: s.kind, name: s.name, color: s.color, types: s.types, text: s.text, keywords: [...s.keywords],
  power: s.power, toughness: s.toughness, loyalty: s.loyalty, sacLife: s.sacLife });
const anthTemplate = a => ({ name: a.name, p: a.p, t: a.t, keywords: [...a.keywords], mode: a.mode, value: a.value });
function addToList(list, tpl) {
  const k = JSON.stringify(tpl);
  if (!list.some(m => JSON.stringify(m) === k)) list.push(tpl);
}
function saveKitName(i) {
  const input = panels[i].querySelector('[data-kitname]');
  const name = input ? input.value.trim() : '';
  if (!name) { if (input) input.focus(); return; }
  if (pickUi[i].naming === 'rename' && kitOf(i)) kitOf(i).name = name;
  else { const k = { id: uid(), name, tokens: [], anthems: [] }; kits.push(k); state.players[i].kit = k.id; save(); }
  saveKits(); pickUi[i].naming = null; openPicker(i, true);
}

/* Picker */
function tplSub(t) {
  if (t.kind === 'creature') return `${t.power}/${t.toughness}${t.keywords && t.keywords.length ? ' · ' + t.keywords.join(', ') : ''}`;
  if (t.kind === 'planeswalker') return `Loyalty ${t.loyalty}`;
  return t.types || t.kind;
}
const pickBtn = (t, attrs) => `<button class="pick" style="--t:${COLORS[t.color] || COLORS.steel}" ${attrs}><strong>${escapeHtml(t.name)}</strong><span>${escapeHtml(tplSub(t))}</span></button>`;
function openPicker(i, keepScroll) {
  closeDrawer(i); closeEditor(i); closeAnthem(i);
  const el = panels[i].querySelector('[data-tokpick]');
  const top = el.scrollTop;
  const kit = kitOf(i), ui = pickUi[i];
  const kitBtns = [`<button class="tog" data-pk="kit" data-v="" aria-pressed="${!kit}">No kit</button>`]
    .concat(kits.map(k => `<button class="tog" data-pk="kit" data-v="${k.id}" aria-pressed="${!!kit && kit.id === k.id}">${escapeHtml(k.name)}</button>`))
    .concat(`<button class="tog" data-pk="kitnew">+ New kit</button>`).join('');
  const naming = ui.naming ? `<div class="kit-row">
      <input data-kitname maxlength="30" autocomplete="off" placeholder="Deck name, e.g. Krenko" value="${ui.naming === 'rename' && kit ? escapeHtml(kit.name) : ''}" aria-label="Deck kit name">
      <button class="tog" data-pk="kitsave">Save</button><button class="tog" data-pk="kitcancel">Cancel</button></div>` : '';
  let kitBody = '';
  if (kit && !ui.naming) {
    const items = kit.tokens.map((t, n) => `<div class="pick-wrap">${pickBtn(t, `data-pk="kittok" data-n="${n}"`)}<button class="unpick" data-pk="unkittok" data-n="${n}" aria-label="Remove ${escapeHtml(t.name)} from ${escapeHtml(kit.name)}">×</button></div>`)
      .concat(kit.anthems.map((a, n) => `<div class="pick-wrap">${anthBtn(a, `data-pk="kitanth" data-n="${n}"`)}<button class="unpick" data-pk="unkitanth" data-n="${n}" aria-label="Remove ${escapeHtml(a.name)} from ${escapeHtml(kit.name)}">×</button></div>`));
    kitBody = (items.length ? `<div class="picks">${items.join('')}</div>`
      : `<p class="hint">This kit is empty. Open any token or anthem on the board and tap “Add to ${escapeHtml(kit.name)}”.</p>`)
      + `<div class="toggles"><button class="tog" data-pk="kitrename">Rename</button><button class="tog danger" data-pk="kitdel">Delete kit</button></div>`;
  }
  const kitSec = `<div class="sec"><div class="lbl">Deck kit</div><div class="toggles">${kitBtns}</div>${naming}${kitBody}</div>`;
  const group = (title, key) => `<div class="sec"><div class="lbl">${title}</div><div class="picks">${PRESETS[key].map((t, n) => pickBtn(t, `data-pk="preset" data-g="${key}" data-n="${n}"`)).join('')}</div></div>`;
  const mine = myTokens.length ? `<div class="sec"><div class="lbl">My tokens</div><div class="picks">${myTokens.map((t, n) =>
    `<div class="pick-wrap">${pickBtn(t, `data-pk="mine" data-n="${n}"`)}<button class="unpick" data-pk="unmine" data-n="${n}" aria-label="Remove ${escapeHtml(t.name)} from My tokens">×</button></div>`).join('')}</div></div>` : '';
  const anths = `<div class="sec"><div class="lbl">Anthems</div><div class="picks">${ANTHEM_PRESETS.map((a, n) => anthBtn(a, `data-pk="anth" data-n="${n}"`)).join('')}</div></div>`;
  el.innerHTML = `
    <div class="drawer-head"><span class="ptitle">Add tokens</span><button class="done" data-pk="close">Close</button></div>
    ${kitSec}
    <div class="row"><div class="rl"><strong>How many</strong><small>Created together as one group</small></div>
      <button class="step" data-pk="q" data-d="-1" aria-label="Fewer">−</button><span class="rv" data-pqv>${pickQty[i]}</span>
      <button class="step" data-pk="q" data-d="1" aria-label="More">+</button></div>
    ${mine}
    ${anths}
    ${group('Creatures', 'creatures')}
    ${group('Artifacts and enchantments', 'others')}
    ${group('Planeswalkers', 'walkers')}
    <div class="toggles"><button class="tog" data-pk="custom">Make your own</button></div>`;
  el.hidden = false; el.scrollTop = keepScroll ? top : 0;
  const nameInput = el.querySelector('[data-kitname]'); if (nameInput) nameInput.focus();
}
const anthBtn = (a, attrs) => `<button class="pick" style="--t:var(--p)" ${attrs}><strong>${escapeHtml(a.name)}</strong><span>${escapeHtml(anthSub(a))}</span></button>`;
function closePicker(i) { pickUi[i].naming = null; panels[i].querySelector('[data-tokpick]').hidden = true; }
function pickerAction(i, b) {
  const a = b.dataset.pk, n = Number(b.dataset.n);
  if (a === 'close') closePicker(i);
  else if (a === 'q') {
    pickQty[i] = Math.min(99, Math.max(1, pickQty[i] + Number(b.dataset.d)));
    panels[i].querySelector('[data-pqv]').textContent = pickQty[i];
  }
  else if (a === 'preset') createTokens(i, PRESETS[b.dataset.g][n], pickQty[i]);
  else if (a === 'mine') createTokens(i, myTokens[n], pickQty[i]);
  else if (a === 'unmine') { myTokens.splice(n, 1); saveMine(); openPicker(i); }
  else if (a === 'custom') createTokens(i, { kind: 'creature', name: 'Token', color: 'steel', power: 1, toughness: 1, types: 'Creature' }, pickQty[i], true);
  else if (a === 'anth') addAnthem(i, ANTHEM_PRESETS[n], ANTHEM_PRESETS[n].mode === 'type');
  else if (a === 'kittok') createTokens(i, kitOf(i).tokens[n], pickQty[i]);
  else if (a === 'kitanth') addAnthem(i, kitOf(i).anthems[n]);
  else if (a === 'unkittok') { kitOf(i).tokens.splice(n, 1); saveKits(); openPicker(i, true); }
  else if (a === 'unkitanth') { kitOf(i).anthems.splice(n, 1); saveKits(); openPicker(i, true); }
  else if (a === 'kit') { state.players[i].kit = b.dataset.v || null; pickUi[i].naming = null; save(); openPicker(i, true); }
  else if (a === 'kitnew') { pickUi[i].naming = 'new'; openPicker(i, true); }
  else if (a === 'kitrename') { pickUi[i].naming = 'rename'; openPicker(i, true); }
  else if (a === 'kitcancel') { pickUi[i].naming = null; openPicker(i, true); }
  else if (a === 'kitsave') saveKitName(i);
  else if (a === 'kitdel') {
    if (!b.classList.contains('armed')) {
      b.classList.add('armed'); b.textContent = 'Tap to delete';
      setTimeout(() => { if (b.isConnected) { b.classList.remove('armed'); b.textContent = 'Delete kit'; } }, 3000);
      return;
    }
    const id = state.players[i].kit;
    kits = kits.filter(k => k.id !== id); saveKits();
    state.players.forEach(p => { if (p.kit === id) p.kit = null; });
    save(); openPicker(i, true);
  }
}

/* Anthem editor */
const anthEdit = [null, null];
const anthOf = i => anthEdit[i] ? state.players[i].anthems.find(a => a.id === anthEdit[i]) : null;
function addAnthem(i, tpl, openAfter) {
  closePicker(i);
  tokAct(i, null, () => {
    const a = { id: uid(), ...anthTemplate(tpl) };
    state.players[i].anthems.push(a);
    if (openAfter) anthEdit[i] = a.id;
    return `adds ${a.name} (${anthSub(a)})`;
  });
}
function openAnthem(i, id) {
  closeDrawer(i); closePicker(i); closeEditor(i);
  anthEdit[i] = id; renderAnthem(i);
  panels[i].querySelector('[data-anthedit]').scrollTop = 0;
}
function closeAnthem(i) {
  anthEdit[i] = null;
  const el = panels[i].querySelector('[data-anthedit]');
  const f = document.activeElement; if (f && el.contains(f)) f.blur();
  el.hidden = true;
}
function anthemHtml(i, a) {
  const tog = (attrs, label, on) => `<button class="tog" ${attrs} aria-pressed="${!!on}">${label}</button>`;
  const num = (f, label, val) => `<div class="row"><div class="rl"><strong>${label}</strong><small>Added to each matching creature</small></div>
    <button class="step" data-ae="num" data-f="${f}" data-d="-1" aria-label="Lower ${label}">−</button><span class="rv">${signed(val)}</span>
    <button class="step" data-ae="num" data-f="${f}" data-d="1" aria-label="Raise ${label}">+</button></div>`;
  const kit = kitOf(i);
  const n = state.players[i].tokens.filter(t => anthemApplies(a, t)).reduce((s, t) => s + t.qty, 0);
  const swatches = Object.keys(COLORS).map(c =>
    `<button class="sw" data-ae="color" data-v="${c}" style="--c:${COLORS[c]}" aria-label="${TOKEN_COLOR_NAMES[c]}" aria-pressed="${a.value === c}"></button>`).join('');
  return `
    <div class="drawer-head">
      <input id="an-${i}" data-af="name" value="${escapeHtml(a.name)}" maxlength="30" autocomplete="off" aria-label="Anthem name">
      <button class="done" data-ae="done">Done</button>
    </div>
    <div class="lbl">Anthem · boosting ${n} creature${n === 1 ? '' : 's'} right now</div>
    <div class="rows">${num('p', 'Power bonus', a.p)}${num('t', 'Toughness bonus', a.t)}</div>
    <div class="sec"><div class="lbl">Applies to</div><div class="toggles">
      ${tog('data-ae="mode" data-v="all"', 'All my creature tokens', a.mode === 'all')}
      ${tog('data-ae="mode" data-v="type"', 'One creature type', a.mode === 'type')}
      ${tog('data-ae="mode" data-v="color"', 'One color', a.mode === 'color')}</div></div>
    ${a.mode === 'type' ? `<div class="field"><label class="lbl" for="av-${i}">Creature type</label><input id="av-${i}" data-af="value" value="${escapeHtml(a.value)}" autocomplete="off" placeholder="Goblin"></div>` : ''}
    ${a.mode === 'color' ? `<div class="swatches"><span class="label">Color</span>${swatches}</div>` : ''}
    <div class="sec"><div class="lbl">Abilities it grants</div><div class="toggles">${KEYWORDS.map(k => tog(`data-ae="kw" data-v="${k}"`, k, a.keywords.includes(k))).join('')}</div></div>
    <div class="toggles">
      ${kit ? `<button class="tog" data-ae="kit">Add to ${escapeHtml(kit.name)}</button>` : ''}
      <button class="tog danger" data-ae="remove">Remove anthem</button>
    </div>`;
}
function renderAnthem(i) {
  const el = panels[i].querySelector('[data-anthedit]');
  const a = anthOf(i);
  if (!a) { anthEdit[i] = null; el.hidden = true; return; }
  const f = document.activeElement;
  if (!el.hidden && f && f.tagName === 'INPUT' && el.contains(f)) return;
  const top = el.scrollTop;
  el.innerHTML = anthemHtml(i, a);
  el.hidden = false; el.scrollTop = top;
}
function anthemAction(i, b) {
  const act = b.dataset.ae, a = anthOf(i);
  if (!a) { closeAnthem(i); return; }
  if (act === 'done') closeAnthem(i);
  else if (act === 'num') tokAct(i, `anth:${b.dataset.f}:${a.id}`, () => { a[b.dataset.f] += Number(b.dataset.d); return `${a.name} → ${anthSub(a)}`; });
  else if (act === 'mode') tokAct(i, null, () => {
    if (a.mode === b.dataset.v) return null;
    a.mode = b.dataset.v; a.value = a.mode === 'color' ? 'white' : '';
    return `${a.name} → ${anthSub(a)}`;
  });
  else if (act === 'color') tokAct(i, null, () => { if (a.value === b.dataset.v) return null; a.value = b.dataset.v; return `${a.name} → ${anthSub(a)}`; });
  else if (act === 'kw') tokAct(i, null, () => {
    const k = b.dataset.v, has = a.keywords.includes(k);
    a.keywords = has ? a.keywords.filter(x => x !== k) : [...a.keywords, k];
    return `${a.name} → ${anthSub(a)}`;
  });
  else if (act === 'kit') { const kit = kitOf(i); if (kit) { addToList(kit.anthems, anthTemplate(a)); saveKits(); b.textContent = `Added to ${kit.name}`; } }
  else if (act === 'remove') tokAct(i, null, () => {
    state.players[i].anthems = state.players[i].anthems.filter(x => x.id !== a.id);
    anthEdit[i] = null;
    return `removes ${a.name}`;
  });
}

/* Editor */
function openEditor(i, id) {
  closeDrawer(i); closePicker(i); closeAnthem(i);
  edit[i] = { id, scope: 'all' };
  renderEditor(i);
  panels[i].querySelector('[data-tokedit]').scrollTop = 0;
}
function closeEditor(i) {
  edit[i] = null;
  const ed = panels[i].querySelector('[data-tokedit]');
  const a = document.activeElement; if (a && ed.contains(a)) a.blur();
  ed.hidden = true;
}
function editorHtml(i, t) {
  const isC = t.kind === 'creature', isPW = t.kind === 'planeswalker';
  const num = (f, label, note, val) => `<div class="row"><div class="rl"><strong>${label}</strong>${note ? `<small>${note}</small>` : ''}</div>
    <button class="step" data-te="num" data-f="${f}" data-d="-1" aria-label="Lower ${label}">−</button><span class="rv">${val}</span>
    <button class="step" data-te="num" data-f="${f}" data-d="1" aria-label="Raise ${label}">+</button></div>`;
  const tog = (attrs, label, on) => `<button class="tog" ${attrs} aria-pressed="${!!on}">${label}</button>`;
  const rows = [num('qty', 'Count', 'Tokens in this group', t.qty)];
  if (isC) rows.push(
    num('power', 'Base power', 'As created', t.power),
    num('toughness', 'Base toughness', 'As created', t.toughness),
    num('counters', t.counters < 0 ? '−1/−1 counters' : '+1/+1 counters', 'They cancel each other out', Math.abs(t.counters)),
    num('tempP', 'Power this turn', 'Clears when the turn passes', (t.tempP > 0 ? '+' : '') + t.tempP),
    num('tempT', 'Toughness this turn', 'Clears when the turn passes', (t.tempT > 0 ? '+' : '') + t.tempT));
  if (isPW) rows.push(num('loyalty', 'Loyalty', t.loyalty === 0 ? 'At 0 it goes to the graveyard' : 'Loyalty counters', t.loyalty));
  const swatches = Object.keys(COLORS).map(c =>
    `<button class="sw" data-te="color" data-v="${c}" style="--c:${COLORS[c]}" aria-label="${TOKEN_COLOR_NAMES[c]}" aria-pressed="${t.color === c}"></button>`).join('');
  return `
    <div class="drawer-head">
      <input id="tn-${i}" data-tf="name" value="${escapeHtml(t.name)}" maxlength="28" autocomplete="off" aria-label="Token name">
      <button class="done" data-te="done">Done</button>
    </div>
    ${isC ? (() => { const a = auraFor(i, t); return `<div class="lbl">Now ${effP(t, a)}/${effT(t, a)}${effT(t, a) <= 0 ? ' · dies at 0 toughness' : ''}${a.p || a.t || a.kw.length ? ` · anthems give ${signed(a.p)}/${signed(a.t)}${a.kw.length ? ', ' + a.kw.join(', ') : ''}` : ''}</div>`; })() : ''}
    ${t.qty > 1 ? `<div class="toggles"><span class="lbl">Changes apply to</span>
      ${tog('data-te="scope" data-v="all"', `All ${t.qty}`, edit[i].scope === 'all')}${tog('data-te="scope" data-v="one"', 'Just one', edit[i].scope === 'one')}</div>` : ''}
    <div class="rows">${rows.join('')}</div>
    <div class="toggles">${tog('data-te="tapped"', 'Tapped', t.tapped)}${isC ? tog('data-te="sick"', 'Summoning sick', t.sick) : ''}</div>
    ${isC ? `<div class="sec"><div class="lbl">Abilities</div><div class="toggles">${KEYWORDS.map(k => tog(`data-te="kw" data-v="${k}"`, k, t.keywords.includes(k))).join('')}</div></div>` : ''}
    <div class="field"><label class="lbl" for="ty-${i}">Type line</label><input id="ty-${i}" data-tf="types" value="${escapeHtml(t.types)}" autocomplete="off" placeholder="Creature — Human Soldier"></div>
    <div class="field"><label class="lbl" for="tx-${i}">Other abilities</label><input id="tx-${i}" data-tf="text" value="${escapeHtml(t.text)}" autocomplete="off" placeholder="Rules text or notes"></div>
    <div class="sec"><div class="lbl">Card type</div><div class="toggles">${KINDS.map(([k, l]) => tog(`data-te="kind" data-v="${k}"`, l, t.kind === k)).join('')}</div></div>
    <div class="swatches"><span class="label">Color</span>${swatches}</div>
    <div class="toggles">
      <button class="tog" data-te="sac">Sacrifice one${t.sacLife ? ` · gain ${t.sacLife} life` : ''}</button>
      <button class="tog" data-te="copy">Copy token</button>
      <button class="tog" data-te="save">Save to My tokens</button>
      ${kitOf(i) ? `<button class="tog" data-te="kit">Add to ${escapeHtml(kitOf(i).name)}</button>` : ''}
      <button class="tog danger" data-te="remove">Remove${t.qty > 1 ? ` all ${t.qty}` : ''}</button>
    </div>`;
}
function renderEditor(i) {
  const ed = panels[i].querySelector('[data-tokedit]');
  const s = stackOf(i);
  if (!s) { edit[i] = null; ed.hidden = true; return; }
  // Leave the panel alone while someone is typing in it (the other player may be tapping life meanwhile)
  const a = document.activeElement;
  if (!ed.hidden && a && a.tagName === 'INPUT' && ed.contains(a)) return;
  if (s.qty <= 1) edit[i].scope = 'all';
  const top = ed.scrollTop;
  ed.innerHTML = editorHtml(i, s);
  ed.hidden = false; ed.scrollTop = top;
}
function editorAction(i, b) {
  const a = b.dataset.te, s = stackOf(i);
  if (!s) { closeEditor(i); return; }
  const list = state.players[i].tokens;
  if (a === 'done') closeEditor(i);
  else if (a === 'scope') { edit[i].scope = b.dataset.v; renderEditor(i); }
  else if (a === 'num') {
    const f = b.dataset.f, d = Number(b.dataset.d);
    if (f === 'qty') {
      tokAct(i, `qty:${s.id}`, () => {
        s.qty += d;
        if (s.qty <= 0) { removeStack(i, s); edit[i] = null; return `removes ${s.name}`; }
        return `${s.name}: ${s.qty} in play`;
      });
    } else {
      tokAct(i, `${f}:${edit[i].scope}:${s.id}`, () => {
        if ((f === 'power' || f === 'toughness' || f === 'loyalty') && s[f] + d < 0) return null;
        const t = targetFor(i);
        t[f] += d;
        return `${tokLabel(t)} → ${statLine(t, i)}`;
      });
    }
  }
  else if (a === 'kw') tokAct(i, null, () => {
    const t = targetFor(i), k = b.dataset.v, has = t.keywords.includes(k);
    t.keywords = has ? t.keywords.filter(x => x !== k) : [...t.keywords, k];
    return `${tokLabel(t)} ${has ? 'loses' : 'gains'} ${k.toLowerCase()}`;
  });
  else if (a === 'tapped') tokAct(i, null, () => { const t = targetFor(i); t.tapped = !t.tapped; return `${t.tapped ? 'taps' : 'untaps'} ${tokLabel(t)}`; });
  else if (a === 'sick') tokAct(i, null, () => { const t = targetFor(i); t.sick = !t.sick; return `${tokLabel(t)} ${t.sick ? 'is summoning sick' : 'can attack'}`; });
  else if (a === 'kind') tokAct(i, null, () => {
    const k = b.dataset.v; if (s.kind === k) return null;
    s.kind = k;
    if (k === 'planeswalker' && !s.loyalty) s.loyalty = 3;
    if (k !== 'creature') s.sick = false;
    return `${s.name} is now a${k === 'artifact' || k === 'enchantment' ? 'n' : ''} ${k}`;
  });
  else if (a === 'color') tokAct(i, null, () => { if (s.color === b.dataset.v) return null; s.color = b.dataset.v; return `${s.name} is now ${TOKEN_COLOR_NAMES[s.color].toLowerCase()}`; });
  else if (a === 'sac') tokAct(i, null, () => {
    s.qty -= 1;
    let txt = `sacrifices a ${s.name}`;
    if (s.sacLife) { state.players[i].life += s.sacLife; flashDelta(i, s.sacLife); txt += ` and gains ${s.sacLife} life`; }
    if (s.qty <= 0) { removeStack(i, s); edit[i] = null; }
    return txt;
  });
  else if (a === 'copy') tokAct(i, null, () => {
    const c = JSON.parse(JSON.stringify(s));
    Object.assign(c, { id: uid(), qty: 1, counters: 0, tempP: 0, tempT: 0, tapped: false, sick: s.kind === 'creature' });
    list.push(c);
    return `copies ${s.name}`;
  });
  else if (a === 'save') { addToList(myTokens, tokTemplate(s)); saveMine(); b.textContent = 'Saved to My tokens'; }
  else if (a === 'kit') { const kit = kitOf(i); if (kit) { addToList(kit.tokens, tokTemplate(s)); saveKits(); b.textContent = `Added to ${kit.name}`; } }
  else if (a === 'remove') tokAct(i, null, () => { removeStack(i, s); edit[i] = null; return `removes ${tokLabel(s)}`; });
}

/* Tray */
function cardHtml(t, i) {
  const au = auraFor(i, t), kws = allKw(t, au);
  const tags = [];
  if (t.tapped) tags.push('<span class="tag">Tapped</span>');
  if (t.kind === 'creature' && t.sick && !kws.includes('Haste')) tags.push('<span class="tag">New</span>');
  if (t.kind === 'creature' && t.counters) tags.push(`<span class="tag ${t.counters > 0 ? 'plus' : 'minus'}">${t.counters > 0 ? '+' : '−'}${Math.abs(t.counters)}/${t.counters > 0 ? '+' : '−'}${Math.abs(t.counters)}</span>`);
  let corner = '';
  if (t.kind === 'creature') {
    const cls = effT(t, au) <= 0 ? 'dead' : (t.tempP || t.tempT) ? 'boost' : (au.p || au.t) ? 'anthem' : '';
    corner = `<span class="pt ${cls}">${effP(t, au)}/${effT(t, au)}</span>`;
  } else if (t.kind === 'planeswalker') corner = `<span class="pt loy">${t.loyalty}</span>`;
  const desc = kws.length ? kws.join(', ') : t.text;
  return `<button class="tok${t.tapped ? ' tapped' : ''}" data-tok="${t.id}" style="--t:${COLORS[t.color] || COLORS.steel}" aria-label="${escapeHtml(tokLabel(t))}. Open to edit.">
    <span class="tn">${escapeHtml(t.name)}</span><span class="tt">${escapeHtml(t.types)}</span>
    ${desc ? `<span class="tk">${escapeHtml(desc)}</span>` : ''}
    <span class="tf"><span class="tags">${t.qty > 1 ? `<span class="tq">×${t.qty}</span>` : ''}${tags.join('')}</span>${corner}</span>
  </button>`;
}
function renderTokens(i) {
  const el = panels[i], list = state.players[i].tokens, anthems = state.players[i].anthems;
  const any = list.length > 0 || anthems.length > 0;
  el.classList.toggle('has-tokens', any);
  el.classList.toggle('has-anthems', anthems.length > 0);
  el.querySelector('[data-tray]').hidden = !any;
  if (!any) { el.querySelector('[data-cards]').innerHTML = ''; el.querySelector('[data-anths]').innerHTML = ''; return; }
  el.querySelector('[data-anths]').innerHTML = anthems.map(a =>
    `<button class="achip" data-anth="${a.id}" aria-label="${escapeHtml(a.name)}, ${escapeHtml(anthSub(a))}. Open to edit.">${escapeHtml(a.name)}<b>${signed(a.p)}/${signed(a.t)}</b></button>`).join('');
  const creatures = list.filter(t => t.kind === 'creature');
  const count = creatures.reduce((n, t) => n + t.qty, 0);
  const power = creatures.reduce((n, t) => n + t.qty * Math.max(0, effP(t, auraFor(i, t))), 0);
  const others = list.filter(t => t.kind !== 'creature').reduce((n, t) => n + t.qty, 0);
  el.querySelector('[data-tsum]').textContent =
    [count ? `${count} creature${count > 1 ? 's' : ''} · ${power} power` : '', others ? `${others} other` : ''].filter(Boolean).join(' · ') || 'No tokens yet';
  const cards = el.querySelector('[data-cards]');
  const top = cards.scrollTop;
  cards.innerHTML = list.map(t => cardHtml(t, i)).join('');
  cards.scrollTop = top;
}

/* ---------- Rendering ---------- */
function lossReason(p) {
  if (p.poison >= 10) return '10 poison';
  if (isCommander() && p.cmd >= 21) return '21 commander damage';
  if (p.life <= 0) return 'Out of life';
  return '';
}

function renderNames() {
  panels.forEach((el, i) => { el.querySelector('.name').textContent = state.players[i].name; });
}

function renderDelta(i) {
  const el = panels[i].querySelector('[data-delta]');
  const d = deltaShown[i];
  el.textContent = d > 0 ? `+${d}` : d < 0 ? `−${-d}` : '';
  el.classList.toggle('show', d !== 0);
  el.classList.toggle('neg', d < 0);
}

function render() {
  const cmd = isCommander();
  state.players.forEach((p, i) => {
    const el = panels[i];
    el.dataset.color = p.color;
    el.classList.toggle('active', state.active === i);
    el.querySelector('[data-life]').textContent = p.life < 0 ? `−${-p.life}` : p.life;
    el.querySelector('.name').textContent = p.name;
    el.querySelector('[data-b="turn"]').hidden = state.active !== i;
    el.querySelector('[data-b="monarch"]').hidden = state.monarch !== i;
    el.querySelector('[data-b="initiative"]').hidden = state.initiative !== i;

    const reason = lossReason(p);
    el.classList.toggle('lost', !!reason);
    const out = el.querySelector('[data-out]');
    out.hidden = !reason; out.textContent = reason;

    const chips = COUNTERS.filter(c => (!c.commanderOnly || cmd) && (p[c.key] > 0 || c.key === 'cmd'))
      .map(c => {
        const v = p[c.key];
        const cls = c.lethal && v >= c.lethal ? 'lethal' : c.near && v >= c.near ? 'near' : '';
        return `<button class="chip ${cls}">${c.key === 'cmd' ? 'Cmdr' : c.label}<b>${v}</b></button>`;
      });
    chips.push('<button class="chip more" data-addtok>+ Token</button>', '<button class="chip more">Counters</button>');
    el.querySelector('[data-chips]').innerHTML = chips.join('');

    COUNTERS.forEach(c => {
      const row = el.querySelector(`[data-row="${c.key}"]`);
      row.hidden = c.commanderOnly && !cmd;
      const v = p[c.key];
      row.querySelector('[data-val]').textContent = v;
      row.classList.toggle('lethal', !!c.lethal && v >= c.lethal);
      row.classList.toggle('near', !!c.near && v >= c.near && !(c.lethal && v >= c.lethal));
    });
    el.querySelectorAll('[data-drawer] .sw').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.color === p.color)));
    renderTokens(i);
    renderEditor(i);
    renderAnthem(i);
    el.querySelectorAll('[data-tog]').forEach(b => b.setAttribute('aria-pressed', String(state[b.dataset.tog] === i)));
  });

  const activeColor = state.players[state.active].color;
  const pass = document.getElementById('btn-pass');
  pass.style.setProperty('--accent', COLORS[activeColor]);
  pass.style.setProperty('--accent-ink', PBG[activeColor]);
  document.getElementById('turn-who').textContent = state.players[state.active].name;
  document.getElementById('turn-label').textContent = `Turn ${state.turn}`;
  pass.setAttribute('aria-label', `Turn ${state.turn}, ${state.players[state.active].name} to play. Pass turn.`);
  document.getElementById('btn-undo').disabled = undoStack.length === 0;
  const dn = document.getElementById('dn-label');
  dn.textContent = state.dayNight === 'day' ? 'Day' : state.dayNight === 'night' ? 'Night' : 'Day/Night';
  document.getElementById('btn-daynight').style.color = state.dayNight ? 'var(--ink)' : '';
  document.getElementById('dn-icon').innerHTML = state.dayNight === 'night'
    ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  renderClock();
}

function renderClock() {
  const s = Math.max(0, Math.floor((Date.now() - state.startedAt) / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60;
  document.getElementById('clock').textContent =
    (h ? `${h}:${String(m).padStart(2, '0')}` : m) + ':' + String(sec).padStart(2, '0');
}

/* ---------- Sheets ---------- */
function openSheet(id) { document.getElementById(id).hidden = false; }
function closeSheets() { document.querySelectorAll('.scrim').forEach(s => { s.hidden = true; }); }
document.querySelectorAll('.scrim').forEach(s => {
  s.addEventListener('click', e => { if (e.target === s || e.target.closest('[data-close]')) closeSheets(); });
});

let pick = { format: 'commander', life: 40, first: 'random' };
function renderNewSheet() {
  document.getElementById('formats').innerHTML = FORMATS.map(f =>
    `<button class="opt" data-format="${f.id}" aria-pressed="${pick.format === f.id}"><strong>${f.name} · ${f.life}</strong><span>${f.note}</span></button>`).join('');
  document.getElementById('sl-value').textContent = pick.life;
  const names = state.players.map(p => p.name);
  document.getElementById('first-opts').innerHTML = [['random', 'Random', 'Pick for us'], ['0', names[0], 'Left / top'], ['1', names[1], 'Right / bottom']]
    .map(([v, t, n]) => `<button class="opt" data-first="${v}" aria-pressed="${pick.first === v}"><strong>${escapeHtml(t)}</strong><span>${n}</span></button>`).join('');
}
document.getElementById('formats').addEventListener('click', e => {
  const b = e.target.closest('[data-format]'); if (!b) return;
  pick.format = b.dataset.format; pick.life = FORMATS.find(f => f.id === pick.format).life; renderNewSheet();
});
document.getElementById('first-opts').addEventListener('click', e => {
  const b = e.target.closest('[data-first]'); if (!b) return;
  pick.first = b.dataset.first; renderNewSheet();
});
document.getElementById('sl-minus').addEventListener('click', () => { pick.life = Math.max(1, pick.life - 5); renderNewSheet(); });
document.getElementById('sl-plus').addEventListener('click', () => { pick.life += 5; renderNewSheet(); });
document.getElementById('btn-new').addEventListener('click', () => {
  pick = { format: state.format, life: state.startLife, first: 'random' };
  renderNewSheet(); openSheet('sheet-new');
});
document.getElementById('btn-start').addEventListener('click', () => {
  const random = pick.first === 'random';
  const first = random ? Math.floor(Math.random() * 2) : Number(pick.first);
  pushUndo();
  state = newState(state, pick.format, pick.life, first);
  addLog({ p: first, text: 'goes first' });
  panels.forEach((_, i) => { closeDrawer(i); closePicker(i); closeEditor(i); closeAnthem(i); });
  closeSheets(); commit();
  if (random) announce(state.players[first].name, 'goes first');
});

document.getElementById('btn-undo').addEventListener('click', undo);
document.getElementById('btn-pass').addEventListener('click', passTurn);
document.getElementById('btn-daynight').addEventListener('click', () => {
  pushUndo();
  state.dayNight = state.dayNight === null ? 'day' : state.dayNight === 'day' ? 'night' : null;
  addLog({ p: null, text: state.dayNight ? `It becomes ${state.dayNight}` : 'Day/night cleared' });
  commit();
});
document.getElementById('btn-dice').addEventListener('click', () => openSheet('sheet-dice'));
document.getElementById('sheet-dice').addEventListener('click', e => {
  const b = e.target.closest('[data-roll]'); if (!b) return;
  const r = b.dataset.roll;
  let big, small;
  if (r === 'coin') { big = Math.random() < .5 ? 'Heads' : 'Tails'; small = 'Coin flip'; }
  else if (r === '2d6') { const n = Math.floor(Math.random() * 6); big = n === 0 ? 'Chaos' : n === 1 ? 'Planeswalk' : 'Blank'; small = 'Planar die'; }
  else { big = String(1 + Math.floor(Math.random() * Number(r))); small = `d${r}`; }
  closeSheets();
  addLog({ p: null, text: `${small}: ${big}` }); save();
  announce(big, small);
});
document.getElementById('btn-log').addEventListener('click', () => { renderLog(); openSheet('sheet-log'); });

function renderLog() {
  const list = document.getElementById('log-list');
  const items = state.log.filter(e => e.text || e.delta).slice().reverse();
  if (!items.length) { list.innerHTML = '<li class="empty">Nothing yet. Life changes, counters and turns show up here.</li>'; return; }
  list.innerHTML = items.map(e => {
    const who = e.p === null || e.p === undefined ? '' :
      `<em style="--c:${COLORS[state.players[e.p].color]}">${escapeHtml(state.players[e.p].name)}</em> `;
    let what, d = '';
    if (e.text) what = `${who}${escapeHtml(e.text)}`;
    else {
      const c = COUNTERS.find(x => x.key === e.key);
      const label = e.key === 'life' ? 'life' : c.label.toLowerCase();
      what = `${who}${label} → ${e.after}${e.lifeAfter !== undefined ? ` (life ${e.lifeAfter})` : ''}`;
      const good = e.key === 'life' ? e.delta > 0 : e.delta < 0;
      d = `<span class="ld ${good ? 'pos' : 'neg'}">${e.delta > 0 ? '+' : '−'}${Math.abs(e.delta)}</span>`;
    }
    return `<li><span class="lt">Turn ${e.turn}</span><span class="lw">${what}</span>${d}</li>`;
  }).join('');
}

const announceEl = document.getElementById('announce');
let announceTimer = null;
function announce(big, small) {
  announceEl.querySelectorAll('[data-a="big"]').forEach(n => { n.textContent = big; });
  announceEl.querySelectorAll('[data-a="small"]').forEach(n => { n.textContent = small; });
  announceEl.hidden = false;
  announceEl.classList.remove('roll'); void announceEl.offsetWidth; announceEl.classList.add('roll');
  clearTimeout(announceTimer);
  announceTimer = setTimeout(() => { announceEl.hidden = true; }, 4000);
}
announceEl.addEventListener('click', () => { announceEl.hidden = true; });

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ---------- Keep the screen awake ---------- */
let wakeLock = null;
async function wake() {
  if (wakeLock || !('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (e) { wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });
document.addEventListener('pointerdown', wake, { passive: true });

// Stop iOS pinch and double-tap zoom from hijacking fast tapping
['gesturestart', 'gesturechange', 'dblclick'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));

/* ---------- Boot ---------- */
function start(hot) {
  state = (hot && hot.state) || load() || newState(null, 'commander', 40, 0);
  state.players.forEach(p => {
    if (!Array.isArray(p.tokens)) p.tokens = [];
    if (!Array.isArray(p.anthems)) p.anthems = [];
    if (p.kit === undefined) p.kit = null;
  });
  if (hot && hot.undo) undoStack = hot.undo;
  buildPanel(0); buildPanel(1);
  renderBg(0); renderBg(1);
  render();
  setInterval(renderClock, 1000);
}
window.claude?.hot?.snapshot?.(() => ({ state, undo: undoStack }));
if (window.claude?.hot?.ready) window.claude.hot.ready(start);
else start(window.claude?.hot?.data ?? {});

// Offline support when served from its own site (GitHub Pages)
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
