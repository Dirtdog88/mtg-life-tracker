<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life Tracker">
<meta name="theme-color" content="#0c0d11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Duel Life Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Cinzel:wght@600;700&display=swap">
<style>
/* Layout: the iPad stands or lies beside both players, facing them. Two halves, both upright,
   side by side in landscape and stacked in portrait, over a thin shared strip of table controls. One deliberate dark look, tinted by each player's mana color. */
:root {
  color-scheme: dark;
  --table: #0c0d11;
  --strip: #15171d;
  --ink: #f2efe8;
  --muted: rgba(242, 239, 232, .62);
  --faint: rgba(242, 239, 232, .14);
  --line: rgba(242, 239, 232, .1);
  --danger: #ff5d5d;
  --warn: #ffc857;
  --scrim: rgba(5, 6, 9, .72);

  --f-num: "Barlow Condensed", "Arial Narrow", ui-sans-serif, system-ui, sans-serif;
  --f-ui: "Barlow", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-title: "Cinzel", "Trajan Pro", Georgia, serif;
}

* { box-sizing: border-box; }
html { height: 100%; background: var(--table); }
body {
  height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--table); color: var(--ink); font-family: var(--f-ui); font-size: 15px;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--p, var(--ink)); outline-offset: 2px; }
[hidden] { display: none !important; }

.app {
  height: 100%; display: flex; flex-direction: column;
  /* Clear the status bar and rounded corners when launched from the Home Screen */
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}

/* ---------- Player halves ---------- */
.player {
  --p: #8db8ff; --pbg: #13233a;
  flex: 1 1 0; min-height: 0; position: relative; overflow: hidden;
  background:
    radial-gradient(120% 90% at 50% 100%, color-mix(in srgb, var(--p) 22%, transparent), transparent 70%),
    var(--pbg);
  transition: background-color .3s;
}
.player[data-color="white"] { --p: #f0deaa; --pbg: #29251c; }
.player[data-color="blue"]  { --p: #8db8ff; --pbg: #122138; }
.player[data-color="black"] { --p: #c1a6e6; --pbg: #1c1626; }
.player[data-color="red"]   { --p: #ff8f6e; --pbg: #33150f; }
.player[data-color="green"] { --p: #84d9a4; --pbg: #10281b; }
.player[data-color="gold"]  { --p: #e9c55c; --pbg: #2a210e; }
.player[data-color="steel"] { --p: #c6cfda; --pbg: #1d2128; }

.board { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 2px; background: var(--table); }
@media (orientation: landscape) { .board { flex-direction: row; } }
.face { position: absolute; inset: 0; container-type: size; }
/* Optional player photo: darkened behind the life total so the number stays readable */
.bg { position: absolute; inset: 0; background-size: cover; background-position: center; display: none; }
.bg::after {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(70% 60% at 50% 50%, rgba(0, 0, 0, .55), rgba(0, 0, 0, .2) 80%),
    color-mix(in srgb, var(--pbg) 40%, transparent);
}
.player.has-bg .bg { display: block; }
.player.has-bg .life { text-shadow: 0 2px 4px rgba(0, 0, 0, .6), 0 6px 40px rgba(0, 0, 0, .7); }
.player.has-bg .zone .glyph { color: color-mix(in srgb, var(--p) 70%, transparent); }
.photo { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.photo .label { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.photo .msg { font-size: 13px; color: var(--muted); }
.photo .msg.err { color: var(--danger); }
.file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.player.active::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--p) 75%, transparent);
}

/* Tap zones: left half lowers life, right half raises it */
.zone {
  position: absolute; top: 0; bottom: 0; width: 50%; border: 0; background: transparent; padding: 0;
  display: flex; align-items: center; touch-action: none;
}
.zone.minus { left: 0; justify-content: flex-start; padding-left: clamp(16px, 5cqw, 56px); }
.zone.plus  { right: 0; justify-content: flex-end; padding-right: clamp(16px, 5cqw, 56px); }
.zone .glyph {
  font-family: var(--f-num); font-weight: 500; font-size: min(22cqh, 12cqw); line-height: 1;
  color: color-mix(in srgb, var(--p) 45%, transparent); transition: color .15s, transform .15s;
}
.zone.pressed { background: color-mix(in srgb, var(--p) 9%, transparent); }
.zone.pressed .glyph { color: var(--p); transform: scale(1.12); }

.center {
  position: absolute; inset: 0; top: var(--hh, 0px); bottom: var(--bh, 0px); pointer-events: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.life-wrap { position: relative; display: flex; align-items: center; }
.life {
  font-family: var(--f-num); font-weight: 700; line-height: .82; letter-spacing: -.01em;
  /* Fits the space above the tray and chips (--bh is measured in script) */
  font-size: max(44px, min(50cqh, 36cqw, calc((100cqh - var(--bh, 0px) - var(--hh, 0px) - 24px) * .8)));
  font-variant-numeric: tabular-nums; color: var(--ink);
  text-shadow: 0 4px 30px color-mix(in srgb, var(--p) 30%, transparent);
}
.delta {
  position: absolute; left: 100%; top: 4%; margin-left: .3em;
  font-family: var(--f-num); font-weight: 600; font-size: min(11cqh, 7cqw); color: var(--p);
  opacity: 0; transition: opacity .25s; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.delta.show { opacity: 1; }
/* No room beside the number (three-digit or negative life): sit above its right edge instead */
.delta.above { left: auto; right: 0; top: auto; bottom: 100%; margin: 0 0 .1em; }
.delta.neg { color: var(--danger); }
.out {
  margin-top: 1.5cqh; font-family: var(--f-title); font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; font-size: clamp(12px, 3.6cqh, 20px); color: var(--danger);
}
.player.lost .life { color: var(--danger); opacity: .85; }

/* Header row: name and status badges */
.head {
  position: absolute; top: 0; left: 0; right: 0; z-index: 2; pointer-events: none;
  display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
  padding: clamp(10px, 3cqh, 20px) 16px 0;
}
.name {
  pointer-events: auto; border: 0; background: none; padding: 4px 8px;
  font-family: var(--f-title); font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  font-size: clamp(13px, 3.4cqh, 19px); color: var(--p);
}
.badge {
  font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--p) 55%, transparent);
  color: var(--p); background: color-mix(in srgb, var(--p) 10%, transparent);
}
.badge.turn { background: var(--p); color: var(--pbg); border-color: var(--p); }

/* Counter chips along the bottom edge of each half */
.bottom {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 2; pointer-events: none;
  display: flex; flex-direction: column; gap: 8px; padding: 0 12px clamp(10px, 3cqh, 20px);
}
.chips { pointer-events: none; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.chip {
  pointer-events: auto; display: inline-flex; align-items: center; gap: 7px;
  min-height: 44px; padding: 8px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: rgba(0, 0, 0, .28);
  font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
}
.chip b { font-family: var(--f-num); font-size: 22px; font-weight: 700; color: var(--ink); letter-spacing: 0; line-height: 1; }
.chip.near b { color: var(--warn); }
/* Small halves (phones): compact chips, and chip rows scroll sideways instead of stacking up */
@container (max-width: 520px) {
  .chip { min-height: 38px; padding: 5px 10px; font-size: 11px; gap: 5px; border-radius: 10px; flex: none; }
  .chip b { font-size: 18px; }
  .face .chips, .face .anths { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; pointer-events: auto; scrollbar-width: none; gap: 6px; }
  .chips::-webkit-scrollbar, .anths::-webkit-scrollbar { display: none; }
  .face .achip { flex: none; }
}
.chip.lethal { border-color: var(--danger); }
.chip.lethal b { color: var(--danger); }
.chip.more { color: var(--p); border-color: color-mix(in srgb, var(--p) 40%, transparent); }

/* ---------- Tokens ---------- */
/* With tokens out, the life total moves up and the tray takes the lower part of the half */
.zone { bottom: var(--bh, 0px); padding-top: var(--hh, 0px); }
.tray {
  pointer-events: auto; display: flex; flex-direction: column; gap: 6px; padding: 8px;
  border-radius: 14px; border: 1px solid var(--line); background: rgba(0, 0, 0, .3);
}
.tray-head { display: flex; align-items: center; gap: 8px; padding: 0 4px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tray-head .sum { flex: 1; min-width: 0; }
.tray-head button {
  min-height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: none;
  font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.tray-head button.armed { color: var(--danger); border-color: var(--danger); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 6px; max-height: 34cqh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.tok {
  --t: #c6cfda; text-align: left; display: flex; flex-direction: column; gap: 3px; min-height: 96px; min-width: 0;
  padding: 7px 9px 8px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--t) 35%, transparent);
  border-top: 4px solid var(--t); background: color-mix(in srgb, var(--t) 10%, rgba(10, 11, 15, .88));
}
.tok .tn { font-weight: 700; font-size: 14px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tok .tt { font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tok .tk { font-size: 12px; line-height: 1.25; color: var(--ink); opacity: .85; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tok .tf { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; }
.tok .tags { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; min-width: 0; }
.tok .tq { font-family: var(--f-num); font-weight: 700; font-size: 20px; line-height: 1; color: var(--t); }
.tok .tag { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 6px; border-radius: 6px; background: rgba(255, 255, 255, .08); color: var(--muted); }
.tok .tag.plus { color: #84d9a4; }
.tok .tag.minus { color: var(--danger); }
.tok .pt {
  flex: none; font-family: var(--f-num); font-weight: 700; font-size: 24px; line-height: 1; padding: 2px 8px; border-radius: 8px;
  background: rgba(0, 0, 0, .45); border: 1px solid color-mix(in srgb, var(--t) 45%, transparent); font-variant-numeric: tabular-nums;
}
.tok .pt.boost { color: var(--warn); }
.tok .pt.dead { color: var(--danger); }
.tok .pt.loy { border-radius: 8px 8px 16px 16px; padding: 2px 10px 4px; }
.tok.tapped { opacity: .55; }
/* Scryfall art behind a token card, darkened toward the bottom so text stays readable */
.tok.has-art {
  background-image: linear-gradient(180deg, rgba(8, 9, 12, .2) 0%, rgba(8, 9, 12, .78) 52%, rgba(8, 9, 12, .94) 100%), var(--art);
  background-size: cover; background-position: center 30%;
}
.tok.has-art .tn, .tok.has-art .tt, .tok.has-art .tk { text-shadow: 0 1px 3px rgba(0, 0, 0, .9); }
.tok.has-art .tt { color: rgba(242, 239, 232, .8); }
.art-q {
  height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0, 0, 0, .3);
  color: var(--ink); font-family: var(--f-ui); font-size: 16px; -webkit-user-select: text; user-select: text; width: 100%;
}
.sugs { display: flex; flex-wrap: wrap; gap: 6px; }
.arts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.artopt {
  padding: 0; border-radius: 10px; overflow: hidden; border: 2px solid transparent; background: rgba(0, 0, 0, .3);
  display: flex; flex-direction: column; text-align: left;
}
.artopt[aria-pressed="true"] { border-color: var(--p); }
.artopt img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: rgba(255, 255, 255, .04); }
.artopt span { padding: 6px 8px; font-size: 11px; line-height: 1.3; color: var(--muted); }
.artopt span b { display: block; color: var(--ink); font-size: 12px; }
.artrow { display: flex; gap: 12px; align-items: center; }
.artthumb { width: 96px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; flex: none; }
.credit { font-size: 12px; color: var(--muted); }
.tok { cursor: pointer; }
.abils { display: flex; gap: 4px; flex-wrap: wrap; }
.abil {
  min-height: 34px; padding: 2px 8px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--t) 50%, transparent);
  background: rgba(0, 0, 0, .4); font-size: 12px; font-weight: 700; color: var(--ink); text-align: left;
}
.abil b { font-family: var(--f-num); font-size: 15px; color: var(--t); margin-right: 3px; }
.abil:disabled, .tog:disabled { opacity: .35; }
.lbl { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.sec { display: flex; flex-direction: column; gap: 6px; }
.ptitle { flex: 1; min-width: 0; font-family: var(--f-title); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 16px; color: var(--p); }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.pick {
  --t: #c6cfda; width: 100%; height: 100%; min-height: 56px; text-align: left; padding: 8px 10px; border-radius: 10px;
  border: 1px solid var(--line); border-left: 4px solid var(--t); background: rgba(0, 0, 0, .25);
  display: flex; flex-direction: column; justify-content: center; gap: 2px;
}
.pick strong { font-size: 14px; }
.pick span { font-size: 12px; color: var(--muted); }
.pick:active { background: color-mix(in srgb, var(--t) 18%, transparent); }
.pick-wrap { position: relative; }
.pick-wrap .pick { padding-right: 40px; }
.unpick { position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border-radius: 8px; border: 0; background: rgba(255, 255, 255, .08); color: var(--muted); font-size: 18px; line-height: 1; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input {
  height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0, 0, 0, .3);
  color: var(--ink); font-family: var(--f-ui); font-size: 16px; -webkit-user-select: text; user-select: text;
}
.tog.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, transparent); }
.tog.armed { color: var(--danger); border-color: var(--danger); }
.tok .pt.anthem { color: #84d9a4; }
.anths { display: flex; gap: 6px; flex-wrap: wrap; }
.achip {
  min-height: 34px; padding: 4px 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid color-mix(in srgb, var(--p) 50%, transparent); background: color-mix(in srgb, var(--p) 12%, transparent);
  font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--ink);
}
.achip b { font-family: var(--f-num); font-size: 15px; color: var(--p); }
.kit-row { display: flex; gap: 8px; flex-wrap: wrap; }
.kit-row input {
  flex: 1; min-width: 160px; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line);
  background: rgba(0, 0, 0, .3); color: var(--ink); font-family: var(--f-ui); font-size: 16px; -webkit-user-select: text; user-select: text;
}
.hint { margin: 0; font-size: 13px; color: var(--muted); }

/* Per-player drawer: opens inside the half, so it faces its owner */
.drawer {
  position: absolute; inset: 0; z-index: 5; background: color-mix(in srgb, var(--pbg) 94%, black);
  display: flex; flex-direction: column; padding: clamp(12px, 3cqh, 22px) 16px;
  gap: 12px; overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.drawer-head { display: flex; align-items: center; gap: 12px; }
.drawer-head input {
  flex: 1; min-width: 0; height: 44px; padding: 0 12px; border-radius: 10px;
  border: 1px solid var(--line); background: rgba(0, 0, 0, .3); color: var(--ink);
  font-family: var(--f-title); font-weight: 700; letter-spacing: .08em; font-size: 17px;
  -webkit-user-select: text; user-select: text;
}
.done {
  height: 44px; padding: 0 20px; border-radius: 10px; border: 0;
  background: var(--p); color: var(--pbg); font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
}
.swatches { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.swatches .label { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.sw {
  width: 36px; height: 36px; border-radius: 50%; border: 2px solid transparent; padding: 0;
  background: var(--c); box-shadow: inset 0 0 0 3px rgba(0, 0, 0, .35);
}
.sw[aria-pressed="true"] { border-color: var(--ink); }
.rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 8px 16px; }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) 52px 60px 52px; align-items: center; gap: 6px;
  padding: 6px 6px 6px 12px; border-radius: 12px; background: rgba(0, 0, 0, .25);
}
.row .rl { min-width: 0; }
.row .rl strong { display: block; font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.row .rl small { display: block; font-size: 12px; color: var(--muted); }
.row .rv { text-align: center; font-family: var(--f-num); font-weight: 700; font-size: 30px; font-variant-numeric: tabular-nums; }
.row.near .rv { color: var(--warn); }
.row.lethal .rv { color: var(--danger); }
.step {
  height: 52px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255, 255, 255, .05);
  font-family: var(--f-num); font-size: 28px; font-weight: 600; line-height: 1;
}
.step:active { background: color-mix(in srgb, var(--p) 25%, transparent); }
.toggles { display: flex; gap: 8px; flex-wrap: wrap; }
.tog {
  display: inline-flex; align-items: center; cursor: pointer;
  min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line);
  background: rgba(0, 0, 0, .25); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; font-size: 13px; color: var(--muted);
}
.tog[aria-pressed="true"] { background: color-mix(in srgb, var(--p) 20%, transparent); border-color: var(--p); color: var(--ink); }

/* ---------- Shared strip ---------- */
.strip {
  flex: 0 0 auto; position: relative; z-index: 3;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 12px; background: var(--strip);
  border-top: 1px solid var(--line);
  padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
}
.strip .group { display: flex; align-items: center; gap: 6px; }
.sbtn {
  min-width: 48px; height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line);
  background: rgba(255, 255, 255, .04); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
}
.sbtn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sbtn:active { background: rgba(255, 255, 255, .12); color: var(--ink); }
.sbtn:disabled { opacity: .35; }
.sbtn .t { display: inline; }
.pass {
  height: 48px; padding: 0 18px; border-radius: 12px; border: 0;
  display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; min-width: 0;
  background: var(--accent, #8db8ff); color: var(--accent-ink, #0c0d11);
  font-weight: 700; letter-spacing: .05em; text-transform: uppercase; font-size: 14px;
}

.clock { font-family: var(--f-num); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; color: var(--muted); padding: 0 6px; min-width: 70px; text-align: center; }
@media (max-width: 760px) {

}

/* ---------- Center sheets ---------- */
.scrim {
  position: fixed; inset: 0; z-index: 20; background: var(--scrim);

}

}

<script>
(() => {
'use strict';

const STORE_KEY = 'mtg-duel-life-v1';
// Photos live apart from the game so New game and Undo never touch them.
const BG_KEY = 'mtg-duel-bg-v1';
let bgs = (() => { try { return JSON.parse(localStorage.getItem(BG_KEY)) || {}; } catch (e) { return {}; } })();
function saveBgs() { try { localStorage.setItem(BG_KEY, JSON.stringify(bgs)); return true; } catch (e) { return false; } }

// Scale a photo down and re-encode as JPEG so two of them fit comfortably in browser storage.
function shrink(file, maxSide, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * k));
      c.height = Math.max(1, Math.round(img.naturalHeight * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('unreadable')); };
    img.src = url;
  });
}

async function setPhoto(i, file) {
  bgMessage(i, 'Loading photo…');
  try {
    delete bgs['credit' + i];
    bgs[i] = await shrink(file, 1400, .8);
    if (!saveBgs()) {
      bgs[i] = await shrink(file, 900, .7);
      if (!saveBgs()) { renderBg(i); bgMessage(i, 'Photo shown, but the iPad had no room to save it. It will be gone after a reload.', true); return; }
    }
    renderBg(i); bgMessage(i, 'Photo saved');
    setTimeout(() => bgMessage(i, ''), 2500);
  } catch (e) {
    bgMessage(i, 'That file could not be opened as an image. Try a JPEG or PNG.', true);
  }
}
function bgMessage(i, text, err) {
  const m = panels[i].querySelector('[data-bg-msg]');
  m.textContent = text; m.classList.toggle('err', !!err);
}
function renderBg(i) {
  const el = panels[i];
  el.querySelector('[data-bg]').style.backgroundImage = bgs[i] ? `url("${bgs[i]}")` : '';
  el.classList.toggle('has-bg', !!bgs[i]);
  el.querySelector('[data-bg-remove]').hidden = !bgs[i];
  el.querySelector('[data-bg-credit]').textContent = bgs[i] && bgs['credit' + i] ? `Art: ${bgs['credit' + i]} · Scryfall` : '';
}
const COLORS = {
  white: '#f0deaa', blue: '#8db8ff', black: '#c1a6e6', red: '#ff8f6e',
  green: '#84d9a4', gold: '#e9c55c', steel: '#c6cfda'
};
const COLOR_NAMES = { white: 'White', blue: 'Blue', black: 'Black', red: 'Red', green: 'Green', gold: 'Gold', steel: 'Colorless' };
const PBG = { white: '#29251c', blue: '#122138', black: '#1c1626', red: '#33150f', green: '#10281b', gold: '#2a210e', steel: '#1d2128' };
const FORMATS = [
  { id: 'standard', name: 'Constructed', note: 'Standard, Pioneer, Modern', life: 20, commander: false },
  { id: 'commander', name: 'Commander', note: 'Duel or casual EDH', life: 40, commander: true },
  { id: 'brawl', name: 'Brawl', note: 'Two-player Brawl', life: 25, commander: true },
  { id: 'limited', name: 'Limited', note: 'Draft or sealed', life: 20, commander: false }
];
// Counters every player carries. `lethal` marks a loss; `life` means it also costs life.
const COUNTERS = [
  { key: 'poison', label: 'Poison', note: '10 and you lose', lethal: 10, near: 7 },
  { key: 'cmd', label: 'Commander dmg', note: 'From their commander. 21 loses', lethal: 21, near: 15, commanderOnly: true, life: true },
  { key: 'tax', label: 'Commander tax', note: '+2 each recast', step: 2, commanderOnly: true },
  { key: 'energy', label: 'Energy', note: 'Energy counters' },
  { key: 'exp', label: 'Experience', note: 'Experience counters' },
  { key: 'storm', label: 'Storm', note: 'Spells this turn. Resets on pass' }
];

function freshPlayer(name, color, life) {
  return { name, color, life, poison: 0, cmd: 0, tax: 0, energy: 0, exp: 0, storm: 0, tokens: [], anthems: [], kit: null };
}
function newState(prev, formatId, life, first) {
  const p = prev ? prev.players : [{ name: 'Player 1', color: 'blue' }, { name: 'Player 2', color: 'red' }];
  return {
    format: formatId, startLife: life,
    // The chosen deck kit carries over to the next game; tokens and anthems do not
    players: [0, 1].map(k => Object.assign(freshPlayer(p[k].name, p[k].color, life), { kit: p[k].kit || null })),
    first, active: first, turn: 1, monarch: null, initiative: null, dayNight: null,
    startedAt: Date.now(), log: []
  };
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const s = JSON.parse(raw); if (s && s.players && s.players.length === 2) return s; }
  } catch (e) { /* storage unavailable */ }
  return null;
}
const UNDO_KEY = 'mtg-duel-undo-v1';
let toastTimer = null, lastToast = 0;
function toast(msg, ok) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.hidden = false; el.classList.toggle('ok', !!ok);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 5000);
}
function storageFull() {
  if (Date.now() - lastToast < 15000) return;
  lastToast = Date.now();
  toast("Couldn't save. The iPad's storage for this app is full. Removing a background photo frees space.");
}
let undoSaveTimer = null;
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { storageFull(); }
  // Undo history is saved a moment later so fast tapping stays smooth
  clearTimeout(undoSaveTimer);
  undoSaveTimer = setTimeout(() => {
    try { localStorage.setItem(UNDO_KEY, JSON.stringify(undoStack.slice(-40))); } catch (e) { /* history is a convenience */ }
  }, 400);
}
function flushUndo() {
  clearTimeout(undoSaveTimer);
  try { localStorage.setItem(UNDO_KEY, JSON.stringify(undoStack.slice(-40))); } catch (e) { /* ignore */ }
}
// iPadOS may close the app while it's in the background: save undo history as it leaves the screen
addEventListener('pagehide', flushUndo);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushUndo(); });
function loadUndo() {
  try { const u = JSON.parse(localStorage.getItem(UNDO_KEY)); return Array.isArray(u) ? u : []; } catch (e) { return []; }
}

let state;
let undoStack = [];
let burst = null;            // groups rapid taps into one undo step and one log line
const deltaShown = [0, 0];
const deltaTimers = [null, null];

const fmt = () => FORMATS.find(f => f.id === state.format) || FORMATS[0];
const isCommander = () => fmt().commander;

/* ---------- Building each half ---------- */
const panels = [document.getElementById('p0'), document.getElementById('p1')];

function buildPanel(i) {
  const el = panels[i];
  const swatches = Object.keys(COLORS).map(c =>

/* ---------- Touch handling ---------- */
// Tap: ±1. Hold: ±10 after a beat, then ±10 again every 600 ms while held.
function bindZone(zone, i) {
  const dir = Number(zone.dataset.dir);
  let holdTimer = null, repeatTimer = null, held = false, activeId = null;
  const end = (apply) => {
    if (activeId === null) return;
    clearTimeout(holdTimer); clearInterval(repeatTimer);
    zone.classList.remove('pressed');
    if (apply && !held) changeLife(i, dir);
    activeId = null;
  };
  zone.addEventListener('pointerdown', e => {
    if (activeId !== null) return;
    activeId = e.pointerId; held = false;
    try { zone.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    zone.classList.add('pressed');
    wake();
    holdTimer = setTimeout(() => {
      held = true; changeLife(i, dir * 10);
      repeatTimer = setInterval(() => changeLife(i, dir * 10), 600);
    }, 450);
  });
  zone.addEventListener('pointerup', e => { if (e.pointerId === activeId) end(true); });
  zone.addEventListener('pointercancel', e => { if (e.pointerId === activeId) end(false); });
  zone.addEventListener('click', e => e.preventDefault());
  zone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); changeLife(i, dir); } });
}

function bindStep(btn, i) {
  btn.addEventListener('click', () => {
    const c = COUNTERS.find(x => x.key === btn.dataset.ctr);
    changeCounter(i, c, Number(btn.dataset.dir) * (c.step || 1));
  });
}

/* ---------- State changes ---------- */
// Snapshots leave out the log (it only grows) and remember where it ended, which keeps them small enough to save.
function snapshot() {
  const { log, ...rest } = state;
  return JSON.stringify({ ...rest, logEnd: (state.logBase || 0) + log.length });
}
// `full` keeps the whole log in the snapshot: needed before a new game, which starts a fresh log
function pushUndo(full) {
  undoStack.push(full ? JSON.stringify(state) : snapshot());
  if (undoStack.length > 150) undoStack.shift();
  burst = null;
}
function addLog(entry) {
  entry.turn = state.turn; entry.at = Date.now();
  state.log.push(entry);
  if (state.log.length > 500) { state.log.shift(); state.logBase = (state.logBase || 0) + 1; }
  return entry;
}
function commit() { save(); render(); }

// Rapid changes to the same stat by the same player within 2 s merge into one log line and one undo.
function burstFor(i, key) {
  const now = Date.now();
  if (burst && burst.p === i && burst.key === key && now - burst.t < 2000 && state.log[state.log.length - 1] === burst.entry) {
    burst.t = now; return burst.entry;
  }
  pushUndo();
  const entry = addLog({ p: i, key, delta: 0, after: 0 });
  burst = { p: i, key, t: now, entry };
  return entry;
}

function changeLife(i, d) {
  const entry = burstFor(i, 'life');
  state.players[i].life += d;
  entry.delta += d; entry.after = state.players[i].life;
  flashDelta(i, d);
  commit();
}

function changeCounter(i, c, d) {
  const pl = state.players[i];
  const next = Math.max(0, pl[c.key] + d);
  const real = next - pl[c.key];
  if (!real) return;
  const entry = burstFor(i, c.key);
  pl[c.key] = next;
  entry.delta += real; entry.after = next;
  if (c.life) { pl.life -= real; entry.lifeAfter = pl.life; flashDelta(i, -real); }
  commit();
}

function flashDelta(i, d) {
  deltaShown[i] += d;
  clearTimeout(deltaTimers[i]);
  deltaTimers[i] = setTimeout(() => { deltaShown[i] = 0; renderDelta(i); }, 2000);
  renderDelta(i);
}

function passTurn() {
  pushUndo();
  const from = state.active;
  state.active = 1 - state.active;
  if (state.active === state.first) state.turn += 1;
  state.players.forEach(p => {
    p.storm = 0;
    p.tokens.forEach(t => { t.tempP = 0; t.tempT = 0; t.activated = false; });   // "until end of turn" wears off; loyalty abilities ready again
  });
  // Untap step for the incoming player; their creatures are no longer summoning sick
  state.players[state.active].tokens.forEach(t => { t.tapped = false; t.sick = false; });
  normalize(0); normalize(1);
  addLog({ p: from, text: 'passes the turn' });
  commit();
}

function undo() {
  const prev = undoStack.pop();
  if (!prev) return;
  const snap = JSON.parse(prev);
  if (!Array.isArray(snap.log)) {
    const base = state.logBase || 0;
    snap.log = state.log.slice(0, Math.max(0, (snap.logEnd || 0) - base));
    snap.logBase = base;
  }
  delete snap.logEnd;
  state = snap;
  burst = null;
  deltaShown[0] = deltaShown[1] = 0;
  renderDelta(0); renderDelta(1);
  commit();
}

/* Anthems: static boosts that apply to every matching creature token a player controls */
const ANTHEM_PRESETS = [
  { name: 'Glorious Anthem', p: 1, t: 1, keywords: [], mode: 'all', value: '' },
  { name: 'Intangible Virtue', p: 1, t: 1, keywords: ['Vigilance'], mode: 'all', value: '' },

  { name: 'Tribal lord', p: 1, t: 1, keywords: [], mode: 'type', value: 'Goblin' }

const escRe = w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
// Singular forms a typed word could mean: Goblins → Goblin, Elves → Elf, Faeries → Faerie, Wolves → Wolf
const IRREGULAR = { men: 'man', women: 'woman', mice: 'mouse', geese: 'goose', people: 'person', children: 'child', teeth: 'tooth' };
function stems(w) {
  const l = w.toLowerCase(), out = new Set([l]);
  if (IRREGULAR[l]) out.add(IRREGULAR[l]);
  if (l.endsWith('ves')) { out.add(l.slice(0, -3) + 'f'); out.add(l.slice(0, -3) + 'fe'); }
  if (l.endsWith('ies')) out.add(l.slice(0, -3) + 'y');
  if (l.endsWith('es')) out.add(l.slice(0, -2));
  if (l.endsWith('s')) out.add(l.slice(0, -1));
  return [...out].filter(Boolean);
}
// Several words match if any one of them does; each also matches its own plural
function typeMatch(text, value) {

    stems(w).some(st => new RegExp(`\\b${escRe(st)}(?:s|es)?\\b`, 'i').test(text)));
}
function anthemApplies(a, t) {
  if (t.kind !== 'creature') return false;
  if (a.mode === 'type') return !!a.value && typeMatch(`${t.types} ${t.name}`, a.value);
  if (a.mode === 'color') return t.color === a.value;
  return true;
}
function auraFor(i, t) {
  const out = { p: 0, t: 0, kw: [] };
  state.players[i].anthems.forEach(a => {
    if (!anthemApplies(a, t)) return;
    out.p += a.p; out.t += a.t;
    a.keywords.forEach(k => { if (!out.kw.includes(k)) out.kw.push(k); });

}
const effP = (t, a) => t.power + t.counters + t.tempP + (a ? a.p : 0);
const effT = (t, a) => t.toughness + t.counters + t.tempT + (a ? a.t : 0);
const allKw = (t, a) => [...t.keywords, ...(a ? a.kw.filter(k => !t.keywords.includes(k)) : [])];
const signed = n => (n >= 0 ? '+' : '−') + Math.abs(n);
function anthSub(a) {

  return `${signed(a.p)}/${signed(a.t)}${a.keywords.length ? ' · ' + a.keywords.join(', ') : ''} · ${who}`;

const tokLabel = t => `${t.name}${t.qty > 1 ? ` ×${t.qty}` : ''}`;

// Stacks that end up identical (say, after untapping) merge back into one card.
function sig(t) {

    t.loyalty, t.sacLife, t.counters, t.tempP, t.tempT, t.tapped, t.sick, t.abilities || [], !!t.activated,
    t.art ? t.art.url : '', !!t.noArt]);

function normalize(i) {
  const pl = state.players[i];
  const out = [], bySig = new Map();
  pl.tokens.forEach(t => {
    const k = sig(t), ex = bySig.get(k);

function stackOf(i) { return edit[i] ? state.players[i].tokens.find(t => t.id === edit[i].id) : null; }

/* ---------- Scryfall art ---------- */
// Card data and images from Scryfall's public API (scryfall.com/docs/api). Searching needs a connection;
// chosen art is stored as a link and the offline cache (sw.js) keeps a copy of each image once shown.
const SF = 'https://api.scryfall.com';
const ART_KEY = 'mtg-duel-artcache-v1';
let artCache = (() => { try { return JSON.parse(localStorage.getItem(ART_KEY)) || {}; } catch (e) { return {}; } })();
function saveArtCache() { try { localStorage.setItem(ART_KEY, JSON.stringify(artCache)); } catch (e) { /* ignore */ } }
const artPending = new Set(), artFailedAt = {};
let sfLast = 0;
async function sf(path) {
  // Scryfall asks for 50–100 ms between requests
  const wait = Math.max(0, sfLast + 100 - Date.now()); sfLast = Date.now() + wait;
  if (wait) await new Promise(r => setTimeout(r, wait));
  const r = await fetch(SF + path, { headers: { Accept: 'application/json' } });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('scryfall ' + r.status);
  return r.json();
}
const okArtUrl = u => typeof u === 'string' && u.startsWith('https://cards.scryfall.io/');
function artOf(card) {
  const face = card.image_uris ? card : (card.card_faces || []).find(f => f.image_uris) || {};
  const url = face.image_uris && face.image_uris.art_crop;
  return okArtUrl(url) ? { url, artist: face.artist || card.artist || '', set: card.set_name || '', name: card.name || '' } : null;
}
const sfQuote = n => `"${String(n).replace(/"/g, '')}"`;
const COLOR_Q = { white: 'c=w', blue: 'c=u', black: 'c=b', red: 'c=r', green: 'c=g', steel: 'c=c', gold: 'c>=2' };
async function searchArts(q, order = 'released') {
  const res = await sf(`/cards/search?q=${encodeURIComponent(q)}&unique=art&order=${order}&dir=desc`);
  return res && res.data ? res.data.map(artOf).filter(Boolean) : [];
}
// Token art queries: exact name, matching power/toughness and color first, then the name alone
function tokenQueries(t) {
  const base = `t:token include:extras !${sfQuote(t.name)}`;
  const strict = base + (t.kind === 'creature' ? ` pow=${t.power} tou=${t.toughness}` : '') + (COLOR_Q[t.color] ? ` ${COLOR_Q[t.color]}` : '');
  return strict === base ? [base] : [strict, base];
}
const autoKey = t => `${t.name.toLowerCase()}|${t.kind}|${t.kind === 'creature' ? t.power + '/' + t.toughness : ''}|${t.color}`;
// Art shown for a token: its own choice, else the first matching Scryfall token art (looked up once and remembered)
function artFor(t) {
  if (t.noArt) return null;
  if (t.art && okArtUrl(t.art.url)) return t.art;
  const k = autoKey(t);
  if (artCache[k] === undefined) requestAutoArt(t, k);
  return artCache[k] || null;
}
async function requestAutoArt(t, k) {
  if (artPending.has(k) || (artFailedAt[k] && Date.now() - artFailedAt[k] < 60000)) return;
  artPending.add(k);
  try {
    let found = null;
    for (const q of tokenQueries(t)) { const arts = await searchArts(q); if (arts.length) { found = arts[0]; break; } }
    artCache[k] = found ? { url: found.url, artist: found.artist } : null;
    saveArtCache();
    if (state) { renderTokens(0); renderTokens(1); renderEditor(0); renderEditor(1); }
  } catch (e) { artFailedAt[k] = Date.now(); }
  finally { artPending.delete(k); }
}

function renderAnthem(i) {

function anthemAction(i, b) {

  else if (act === 'mode') tokAct(i, null, () => {
    if (a.mode === b.dataset.v) return null;

  else if (act === 'kw') tokAct(i, null, () => {

}

function renderEditor(i) {
  const ed = panels[i].querySelector('[data-tokedit]');
  const s = stackOf(i);
  if (!s) { edit[i] = null; ed.hidden = true; return; }
  // Leave the panel alone while someone is typing in it (the other player may be tapping life meanwhile)
  const a = document.activeElement;
  if (!ed.hidden && a && a.tagName === 'INPUT' && ed.contains(a)) return;
  if (s.qty <= 1) edit[i].scope = 'all';
  const top = ed.scrollTop;
  setHTML(ed, editorHtml(i, s));
  ed.hidden = false; ed.scrollTop = top;
}
function editorAction(i, b) {
  const a = b.dataset.te, s = stackOf(i);
  if (!s) { closeEditor(i); return; }
  const list = state.players[i].tokens;
  if (a === 'done') closeEditor(i);
  else if (a === 'scope') { edit[i].scope = b.dataset.v; renderEditor(i); }
  else if (a === 'num') {
    const f = b.dataset.f, d = Number(b.dataset.d);

        s.qty += d;

        return `${s.name}: ${s.qty} in play`;
      });
    } else {
      tokAct(i, `${f}:${edit[i].scope}:${s.id}`, () => {
        if ((f === 'power' || f === 'toughness' || f === 'loyalty') && s[f] + d < 0) return null;
        const t = targetFor(i);
        t[f] += d;
        if (f === 'loyalty' && t.kind === 'planeswalker' && t.loyalty <= 0) {
          removeStack(i, t); edit[i] = null;
          return `${t.name} is out of loyalty and goes to the graveyard`;
        }
        return `${tokLabel(t)} → ${statLine(t, i)}`;
      });
    }
  }

  else if (a === 'abil') useAbility(i, s.id, Number(b.dataset.n));
  else if (a === 'empower') tokAct(i, null, () => {
    const t = targetFor(i); t.loyalty += Number(b.dataset.n);
    return `empowers Jace ${b.dataset.n} · loyalty ${t.loyalty}`;
  });
  else if (a === 'kw') tokAct(i, null, () => {

  });
  else if (a === 'tapped') tokAct(i, null, () => { const t = targetFor(i); t.tapped = !t.tapped; return `${t.tapped ? 'taps' : 'untaps'} ${tokLabel(t)}`; });
  else if (a === 'sick') tokAct(i, null, () => { const t = targetFor(i); t.sick = !t.sick; return `${tokLabel(t)} ${t.sick ? 'is summoning sick' : 'can attack'}`; });
  else if (a === 'kind') tokAct(i, null, () => {
    const k = b.dataset.v; if (s.kind === k) return null;

    if (s.qty <= 0) { removeStack(i, s); edit[i] = null; }
    return txt;
  });
  else if (a === 'copy') tokAct(i, null, () => {
    const c = JSON.parse(JSON.stringify(s));
    Object.assign(c, { id: uid(), qty: 1, counters: 0, tempP: 0, tempT: 0, tapped: false, sick: s.kind === 'creature' });
    list.push(c);

  else if (a === 'save') { addToList(myTokens, tokTemplate(s)); saveMine(); b.textContent = 'Saved to My tokens'; }
  else if (a === 'kit') { const kit = kitOf(i); if (kit) { addToList(kit.tokens, tokTemplate(s)); saveKits(); b.textContent = `Added to ${kit.name}`; } }

/* Tray */
function cardHtml(t, i) {
  const au = auraFor(i, t), kws = allKw(t, au);
  const tags = [];
  if (t.tapped) tags.push('<span class="tag">Tapped</span>');
  if (t.activated) tags.push('<span class="tag">Used</span>');
  if (t.kind === 'creature' && t.sick && !kws.includes('Haste')) tags.push('<span class="tag">New</span>');
  if (t.kind === 'creature' && t.counters) tags.push(`<span class="tag ${t.counters > 0 ? 'plus' : 'minus'}">${t.counters > 0 ? '+' : '−'}${Math.abs(t.counters)}/${t.counters > 0 ? '+' : '−'}${Math.abs(t.counters)}</span>`);
  let corner = '';
  if (t.kind === 'creature') {
    const cls = effT(t, au) <= 0 ? 'dead' : (t.tempP || t.tempT) ? 'boost' : (au.p || au.t) ? 'anthem' : '';
    corner = `<span class="pt ${cls}">${effP(t, au)}/${effT(t, au)}</span>`;
  } else if (t.kind === 'planeswalker') corner = `<span class="pt loy">${t.loyalty}</span>`;
  const desc = kws.length ? kws.join(', ') : t.text;
  const abils = t.kind === 'planeswalker' && t.abilities && t.abilities.length
    ? `<span class="abils">${t.abilities.map((ab, n) => `<button class="abil" data-abil="${n}" ${t.loyalty + ab.cost < 0 || t.activated ? 'disabled' : ''} aria-label="${fmtCost(ab.cost)}: ${escapeHtml(ab.text)}"><b>${fmtCost(ab.cost)}</b>${escapeHtml(ab.text)}</button>`).join('')}</span>` : '';
  const art = artFor(t);
  return `<div class="tok${t.tapped ? ' tapped' : ''}${art ? ' has-art' : ''}" data-tok="${t.id}" role="button" tabindex="0" style="--t:${COLORS[t.color] || COLORS.steel}${art ? `;--art:url(&quot;${escapeHtml(art.url)}&quot;)` : ''}" aria-label="${escapeHtml(tokLabel(t))}. Open to edit.">
    <span class="tn">${escapeHtml(t.name)}</span><span class="tt">${escapeHtml(t.types)}</span>
    ${abils || (kws.length ? `<span class="tk">${kws.map(k => `<span class="kwl" data-kw="${escapeHtml(k)}">${escapeHtml(k)}</span>`).join(', ')}</span>` : desc ? `<span class="tk">${escapeHtml(desc)}</span>` : '')}
    <span class="tf"><span class="tags">${t.qty > 1 ? `<span class="tq">×${t.qty}</span>` : ''}${tags.join('')}</span>${corner}</span>
  </div>`;
}
function setHTML(el, html) { if (el._html !== html) { el.innerHTML = html; el._html = html; } }
function renderTokens(i) {
  const el = panels[i], list = state.players[i].tokens, anthems = state.players[i].anthems;
  const any = list.length > 0 || anthems.length > 0;
  el.classList.toggle('has-tokens', any);
  el.classList.toggle('has-anthems', anthems.length > 0);
  el.querySelector('[data-tray]').hidden = !any;
  if (!any) { setHTML(el.querySelector('[data-cards]'), ''); setHTML(el.querySelector('[data-anths]'), ''); return; }
  setHTML(el.querySelector('[data-anths]'), anthems.map(a =>
    `<button class="achip" data-anth="${a.id}" aria-label="${escapeHtml(a.name)}, ${escapeHtml(anthSub(a))}. Open to edit.">${escapeHtml(a.name)}<b>${signed(a.p)}/${signed(a.t)}</b></button>`).join(''));
  const creatures = list.filter(t => t.kind === 'creature');
  const count = creatures.reduce((n, t) => n + t.qty, 0);
  const power = creatures.reduce((n, t) => n + t.qty * Math.max(0, effP(t, auraFor(i, t))), 0);
  const others = list.filter(t => t.kind !== 'creature').reduce((n, t) => n + t.qty, 0);
  el.querySelector('[data-tsum]').textContent =
    [count ? `${count} creature${count > 1 ? 's' : ''} · ${power} power` : '', others ? `${others} other` : ''].filter(Boolean).join(' · ') || 'No tokens yet';
  const cards = el.querySelector('[data-cards]');
  const top = cards.scrollTop;
  setHTML(cards, list.map(t => cardHtml(t, i)).join(''));
  cards.scrollTop = top;
}

/* ---------- Rendering ---------- */
function lossReason(p) {
  if (p.poison >= 10) return '10 poison';
  if (isCommander() && p.cmd >= 21) return '21 commander damage';
  if (p.life <= 0) return 'Out of life';
  return '';
}

function renderNames() {
  panels.forEach((el, i) => { el.querySelector('.name').textContent = state.players[i].name; });
}

function renderDelta(i) {
  const el = panels[i].querySelector('[data-delta]');
  const d = deltaShown[i];
  el.textContent = d > 0 ? `+${d}` : d < 0 ? `−${-d}` : '';
  el.classList.toggle('show', d !== 0);
  el.classList.toggle('neg', d < 0);
  placeDelta(i);
}
// Beside the number when it fits; otherwise above its right edge so it never runs into the + or off the screen
function placeDelta(i) {
  const el = panels[i].querySelector('[data-delta]');
  if (!el.textContent) return;
  el.classList.remove('above');
  const r = el.getBoundingClientRect(), plus = panels[i].querySelector('.zone.plus .glyph').getBoundingClientRect();
  if (r.right > plus.left - 4) el.classList.add('above');
}
// The tray and chips grow upward from the bottom; the life total gets the space above them.
// On small halves the token cards shrink (and scroll) so the life total keeps at least ~30% of the height.
function layoutHalf(i) {
  const el = panels[i], face = el.querySelector('.face');
  const bottom = el.querySelector('.bottom'), cards = el.querySelector('[data-cards]');
  const H = face.clientHeight;
  if (!H) return;
  cards.style.maxHeight = '';
  const head = el.querySelector('.head').offsetHeight;
  const room = H - head - Math.max(90, H * .3);
  let bh = bottom.offsetHeight;
  if (bh > room && cards.offsetHeight) {
    cards.style.maxHeight = Math.max(60, cards.offsetHeight - (bh - room)) + 'px';
    bh = bottom.offsetHeight;
  }
  el.style.setProperty('--bh', bh + 'px');
  el.style.setProperty('--hh', head + 'px');
  fitLife(i);
  placeDelta(i);
}
// Wide totals (−22, 100+) shrink to fit between the − and + marks
function fitLife(i) {
  const el = panels[i], life = el.querySelector('[data-life]');
  life.style.fontSize = '';
  const minus = el.querySelector('.zone.minus .glyph').getBoundingClientRect();
  const plus = el.querySelector('.zone.plus .glyph').getBoundingClientRect();
  const avail = plus.left - minus.right - 24, w = life.getBoundingClientRect().width;
  if (avail > 0 && w > avail) life.style.fontSize = Math.max(36, parseFloat(getComputedStyle(life).fontSize) * avail / w) + 'px';
}

function render() {
  const cmd = isCommander();
  state.players.forEach((p, i) => {
    const el = panels[i];
    el.dataset.color = p.color;
    el.classList.toggle('active', state.active === i);
    el.querySelector('[data-life]').textContent = p.life < 0 ? `−${-p.life}` : p.life;
    el.querySelector('.name').textContent = p.name;
    el.querySelector('[data-b="turn"]').hidden = state.active !== i;
    el.querySelector('[data-b="monarch"]').hidden = state.monarch !== i;
    el.querySelector('[data-b="initiative"]').hidden = state.initiative !== i;

    const reason = lossReason(p);
    el.classList.toggle('lost', !!reason);
    const out = el.querySelector('[data-out]');
    out.hidden = !reason; out.textContent = reason;

    const chips = COUNTERS.filter(c => (!c.commanderOnly || cmd) && (p[c.key] > 0 || c.key === 'cmd'))
      .map(c => {
        const v = p[c.key];
        const cls = c.lethal && v >= c.lethal ? 'lethal' : c.near && v >= c.near ? 'near' : '';
        return `<button class="chip ${cls}">${c.key === 'cmd' ? 'Cmdr' : c.label}<b>${v}</b></button>`;
      });
    chips.push('<button class="chip more" data-addtok>+ Token</button>', '<button class="chip more">Counters</button>');
    setHTML(el.querySelector('[data-chips]'), chips.join(''));

    COUNTERS.forEach(c => {
      const row = el.querySelector(`[data-row="${c.key}"]`);
      row.hidden = c.commanderOnly && !cmd;
      const v = p[c.key];
      row.querySelector('[data-val]').textContent = v;
      row.classList.toggle('lethal', !!c.lethal && v >= c.lethal);
      row.classList.toggle('near', !!c.near && v >= c.near && !(c.lethal && v >= c.lethal));
    });
    el.querySelectorAll('[data-drawer] .sw').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.color === p.color)));
    renderTokens(i);
    layoutHalf(i);
    renderEditor(i);
    renderAnthem(i);
    el.querySelectorAll('[data-tog]').forEach(b => b.setAttribute('aria-pressed', String(state[b.dataset.tog] === i)));
  });

  const activeColor = state.players[state.active].color;
  const pass = document.getElementById('btn-pass');
  pass.style.setProperty('--accent', COLORS[activeColor]);
  pass.style.setProperty('--accent-ink', PBG[activeColor]);
  document.getElementById('turn-who').textContent = state.players[state.active].name;
  document.getElementById('turn-label').textContent = `Turn ${state.turn}`;
  pass.setAttribute('aria-label', `Turn ${state.turn}, ${state.players[state.active].name} to play. Pass turn.`);
  document.getElementById('btn-undo').disabled = undoStack.length === 0;
  const dn = document.getElementById('dn-label');
  dn.textContent = state.dayNight === 'day' ? 'Day' : state.dayNight === 'night' ? 'Night' : 'Day/Night';
  document.getElementById('btn-daynight').style.color = state.dayNight ? 'var(--ink)' : '';
  document.getElementById('dn-icon').innerHTML = state.dayNight === 'night'
    ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  renderClock();
}

function renderClock() {
  const s = Math.max(0, Math.floor((Date.now() - state.startedAt) / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60;
  document.getElementById('clock').textContent =
    (h ? `${h}:${String(m).padStart(2, '0')}` : m) + ':' + String(sec).padStart(2, '0');
}

/* ---------- Sheets ---------- */
function openSheet(id) { document.getElementById(id).hidden = false; }
function closeSheets() { document.querySelectorAll('.scrim').forEach(s => { s.hidden = true; }); }
document.querySelectorAll('.scrim').forEach(s => {
  s.addEventListener('click', e => { if (e.target === s || e.target.closest('[data-close]')) closeSheets(); });
});

let pick = { format: 'commander', life: 40, first: 'random' };
function renderNewSheet() {
  document.getElementById('formats').innerHTML = FORMATS.map(f =>
    `<button class="opt" data-format="${f.id}" aria-pressed="${pick.format === f.id}"><strong>${f.name} · ${f.life}</strong><span>${f.note}</span></button>`).join('');
  document.getElementById('sl-value').textContent = pick.life;
  const names = state.players.map(p => p.name);
  document.getElementById('first-opts').innerHTML = [['random', 'Random', 'Pick for us'], ['0', names[0], 'Left / top'], ['1', names[1], 'Right / bottom']]
    .map(([v, t, n]) => `<button class="opt" data-first="${v}" aria-pressed="${pick.first === v}"><strong>${escapeHtml(t)}</strong><span>${n}</span></button>`).join('');
}
document.getElementById('formats').addEventListener('click', e => {
  const b = e.target.closest('[data-format]'); if (!b) return;
  pick.format = b.dataset.format; pick.life = FORMATS.find(f => f.id === pick.format).life; renderNewSheet();
});
document.getElementById('first-opts').addEventListener('click', e => {
  const b = e.target.closest('[data-first]'); if (!b) return;
  pick.first = b.dataset.first; renderNewSheet();
});
document.getElementById('sl-minus').addEventListener('click', () => { pick.life = Math.max(1, pick.life - 5); renderNewSheet(); });
document.getElementById('sl-plus').addEventListener('click', () => { pick.life += 5; renderNewSheet(); });
document.getElementById('btn-new').addEventListener('click', () => {
  pick = { format: state.format, life: state.startLife, first: 'random' };
  renderNewSheet(); openSheet('sheet-new');
});
document.getElementById('btn-start').addEventListener('click', () => {
  const random = pick.first === 'random';
  const first = random ? Math.floor(Math.random() * 2) : Number(pick.first);
  pushUndo(true);
  state = newState(state, pick.format, pick.life, first);
  addLog({ p: first, text: 'goes first' });
  panels.forEach((_, i) => { closeDrawer(i); closePicker(i); closeEditor(i); closeAnthem(i); closeArtPick(i); });
  closeSheets(); commit();
  if (random) announce(state.players[first].name, 'goes first');
});

document.getElementById('btn-undo').addEventListener('click', undo);
document.getElementById('btn-pass').addEventListener('click', passTurn);
document.getElementById('btn-daynight').addEventListener('click', () => {
  pushUndo();
  state.dayNight = state.dayNight === null ? 'day' : state.dayNight === 'day' ? 'night' : null;
  addLog({ p: null, text: state.dayNight ? `It becomes ${state.dayNight}` : 'Day/night cleared' });
  commit();
});
document.getElementById('btn-dice').addEventListener('click', () => openSheet('sheet-dice'));
document.getElementById('sheet-dice').addEventListener('click', e => {
  const b = e.target.closest('[data-roll]'); if (!b) return;
  const r = b.dataset.roll;
  let big, small;
  if (r === 'coin') { big = Math.random() < .5 ? 'Heads' : 'Tails'; small = 'Coin flip'; }
  else if (r === '2d6') { const n = Math.floor(Math.random() * 6); big = n === 0 ? 'Chaos' : n === 1 ? 'Planeswalk' : 'Blank'; small = 'Planar die'; }
  else { big = String(1 + Math.floor(Math.random() * Number(r))); small = `d${r}`; }
  closeSheets();
  addLog({ p: null, text: `${small}: ${big}` }); save();
  announce(big, small);
});
document.getElementById('btn-log').addEventListener('click', () => { renderLog(); openSheet('sheet-log'); });

function renderLog() {
  const list = document.getElementById('log-list');
  const items = state.log.filter(e => e.text || e.delta).slice().reverse();
  if (!items.length) { list.innerHTML = '<li class="empty">Nothing yet. Life changes, counters and turns show up here.</li>'; return; }
  list.innerHTML = items.map(e => {
    const who = e.p === null || e.p === undefined ? '' :
      `<em style="--c:${COLORS[state.players[e.p].color]}">${escapeHtml(state.players[e.p].name)}</em> `;
    let what, d = '';
    if (e.text) what = `${who}${escapeHtml(e.text)}`;
    else {
      const c = COUNTERS.find(x => x.key === e.key);
      const label = e.key === 'life' ? 'life' : c.label.toLowerCase();
      what = `${who}${label} → ${e.after}${e.lifeAfter !== undefined ? ` (life ${e.lifeAfter})` : ''}`;
      const good = e.key === 'life' ? e.delta > 0 : e.delta < 0;
      d = `<span class="ld ${good ? 'pos' : 'neg'}">${e.delta > 0 ? '+' : '−'}${Math.abs(e.delta)}</span>`;
    }
    return `<li><span class="lt">Turn ${e.turn}</span><span class="lw">${what}</span>${d}</li>`;
  }).join('');
}

// The Comprehensive Rules live in rules.json (kept current by .github/workflows/update-rules.yml) and work offline.
const NAV_KEY = 'mtg-duel-rulesnav-v1', CARDS_KEY = 'mtg-duel-cards-v1', HOUSE_KEY = 'mtg-duel-house-v1', DRAFT_KEY = 'mtg-duel-dispute-v1';
const loadJSON = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
const saveJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { storageFull(); return false; } };
let RULES = null, rulesLoading = null, rulesError = false;
const RX = { by: new Map(), sec: new Map(), gloss: new Map(), kids: new Map(), kw: new Map(), ch: new Map() };
const norm = t => String(t).toLowerCase().replace(/[’‘]/g, "'").replace(/[“”]/g, '"').replace(/[−–—]/g, '-');
let rprefs = loadJSON(NAV_KEY, { recent: [], marks: [] });
let cardCache = loadJSON(CARDS_KEY, []);
let house = loadJSON(HOUSE_KEY, { rulings: [], rules: [] });
let draft = loadJSON(DRAFT_KEY, null);
const rui = { tab: 'search', stack: [], card: null, guide: null };

function loadRules() {
  if (RULES) return Promise.resolve(RULES);
  if (!rulesLoading) rulesLoading = fetch('rules.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => { indexRules(d); RULES = d; rulesError = false; return d; })
    .catch(e => { rulesLoading = null; rulesError = true; throw e; });
  return rulesLoading;
}
function indexRules(d) {
  d.rules.forEach(r => {
    r.n = norm(r.text + ' ' + (r.ex || []).join(' '));
    RX.by.set(r.id, r);
    const parent = /[a-z]$/.test(r.id) ? r.id.replace(/[a-z]+$/, '') : r.id.split('.')[0];
    if (!RX.kids.has(parent)) RX.kids.set(parent, []);
    RX.kids.get(parent).push(r.id);
    // Keyword abilities and actions are titled rules like "702.19. Trample"
    if (/^70[12]\.\d+$/.test(r.id) && r.text.length < 40 && !/[.:]/.test(r.text)) RX.kw.set(norm(r.text), r.id);
  });
  d.sections.forEach(x => RX.sec.set(x.n, x));
  d.chapters.forEach(x => RX.ch.set(x.n, x));
  d.glossary.forEach(g => { g.n = norm(g.term + ' ' + g.text); RX.gloss.set(norm(g.term), g); });
}
const ruleTitle = id => {
  if (RX.sec.has(id)) return RX.sec.get(id).title;
  const r = RX.by.get(id.replace(/[a-z]+$/, ''));
  return r && r.text.length < 60 ? r.text : '';
};
// Rule numbers inside rule text become links
function linkify(text) {
  let h = escapeHtml(text).replace(/\b(\d{3}\.\d+[a-z]?)\b/g, (m, id) => RX.by.has(id) ? `<button class="rlink" data-ref="r:${id}">${id}</button>` : m);
  return h.replace(/\b(rules?|sections?)\s+(\d{3})\b(?![.\d])/gi, (m, w, n) => RX.sec.has(n) ? `${w} <button class="rlink" data-ref="r:${n}">${n}</button>` : m);
}
function mark(html, words) {
  if (!words.length) return html;
  const re = new RegExp(`(${words.map(w => escRe(escapeHtml(w))).join('|')})`, 'gi');
  return html.split(/(<[^>]+>)/).map(part => part.startsWith('<') ? part : part.replace(re, '<mark>$1</mark>')).join('');
}
function snippet(text, words) {
  const n = norm(text);
  let at = words.length ? Math.max(0, n.indexOf(words[0])) : 0;
  const start = Math.max(0, at - 60), end = Math.min(text.length, at + 160);
  return (start ? '…' : '') + text.slice(start, end).replace(/\n/g, ' ') + (end < text.length ? '…' : '');
}
function searchRules(q) {
  const t = norm(q.trim());
  const words = t.split(/\s+/).filter(w => w.length > 1 || /\d/.test(w));
  if (!words.length) return { words, items: [] };
  const items = [];
  // A rule or section number goes straight to the top
  const num = t.replace(/\.$/, '');
  if (/^\d{3}(\.\d+[a-z]?)?$/.test(num) && (RX.by.has(num) || RX.sec.has(num))) items.push({ ref: 'r:' + num, score: 99999 });
  RX.gloss.forEach(g => {
    const term = norm(g.term);
    if (term === t) items.push({ ref: 'g:' + g.term, score: 1000 });
    else if (words.every(w => g.n.includes(w))) items.push({ ref: 'g:' + g.term, score: (term.includes(t) ? 300 : 40) });
  });
  RX.sec.forEach(x => { if (words.every(w => norm(x.title).includes(w))) items.push({ ref: 'r:' + x.n, score: 500 }); });
  // Guides that cover all the words come first: they explain interactions spread over several rules
  GUIDES.forEach(g => { if (words.every(w => norm(g.title + ' ' + g.sum + ' ' + g.body.join(' ') + ' ' + (g.ex || '')).includes(w))) items.push({ ref: 'guide:' + g.id, score: 950 }); });
  // Each keyword mentioned ("trample", "first strike") brings up its own rule
  const seenKw = new Set();
  for (let k = 0; k < words.length; k++) for (const span of [words[k] + ' ' + (words[k + 1] || ''), words[k]]) {
    const id = RX.kw.get(span.trim());
    if (id && !seenKw.has(id)) { seenKw.add(id); items.push({ ref: 'r:' + id, score: 800 }); }
  }
  const all = [], some = [];
  RULES.rules.forEach(r => {
    if (seenKw.has(r.id)) return;
    const hits = words.filter(w => r.n.includes(w)).length;
    if (!hits) return;
    let score = 50;
    if (norm(r.text) === t) score = 900;                         // the keyword's own rule, e.g. "Trample"
    if (r.n.includes(t)) score += 40;                            // the whole phrase appears
    score -= Math.min(30, r.text.length / 40) + (/[a-z]$/.test(r.id) ? 2 : 0);
    if (hits === words.length) all.push({ ref: 'r:' + r.id, score });
    else some.push({ ref: 'r:' + r.id, score: score * hits / words.length - 30 });
  });
  items.push(...all);
  // When few rules contain every word, include rules with some of them, ranked lower
  if (all.length < 15) items.push(...some);
  items.sort((a, b) => b.score - a.score);

}
function resultHtml(ref, words) {

  if (k === 'g') { const g = RX.gloss.get(norm(v)); return `<button class="rres" data-ref="${escapeHtml(ref)}"><b>${mark(escapeHtml(g.term), words)}</b><small>Glossary</small>${mark(escapeHtml(snippet(g.text, words)), words)}</button>`; }
  if (RX.sec.has(v)) return `<button class="rres" data-ref="${ref}"><b>${v}</b>${mark(escapeHtml(RX.sec.get(v).title), words)}<small>Section</small></button>`;
  const r = RX.by.get(v), title = ruleTitle(v);
  return `<button class="rres" data-ref="${ref}"><b>${v}</b>${mark(escapeHtml(snippet(r.text + (r.ex ? ' Example: ' + r.ex.join(' ') : ''), words)), words)}${title && title !== r.text ? `<small>${escapeHtml(title)}</small>` : ''}</button>`;
}
function ruleBlock(id, hit) {

    ${(r.ex || []).map(x => `<div class="rex">Example: ${linkify(x)}</div>`).join('')}</div>`;
}
const isMarked = ref => rprefs.marks.includes(ref);

  return `<div class="rbar"><button class="tog" data-back>Back</button>
    <button class="tog" data-mark="${escapeHtml(ref)}" aria-pressed="${isMarked(ref)}">${isMarked(ref) ? 'Bookmarked' : 'Bookmark'}</button>
    <button class="tog" data-cite="${escapeHtml(ref)}" data-label="${escapeHtml(label)}">Cite in dispute</button></div>`;

      <div class="rlist">${secs.map(x => `<button class="rres" data-ref="r:${x.n}"><b>${x.n}</b>${escapeHtml(x.title)}</button>`).join('')}</div></div>`;
  }
  if (RX.sec.has(v)) {
    const top = (RX.kids.get(v) || []);
    return `${viewBar(ref, refLabel(ref))}<div class="rview"><span class="crumb">Section</span><h3>${v}. ${escapeHtml(RX.sec.get(v).title)}</h3>
      <div class="rlist">${top.map(id => `<button class="rres" data-ref="r:${id}"><b>${id}</b>${escapeHtml(snippet(RX.by.get(id).text, []))}</button>`).join('')}</div></div>`;
  }

  const sec = base.split('.')[0];

}

/* Cards: Oracle text and official rulings from Scryfall, remembered for offline use */
function trimCard(c) {
  const face = x => ({ name: x.name, mana_cost: x.mana_cost || '', type_line: x.type_line || '', oracle_text: x.oracle_text || '', power: x.power, toughness: x.toughness, loyalty: x.loyalty });
  return { name: c.name, keywords: c.keywords || [], faces: c.card_faces && !c.oracle_text ? c.card_faces.map(face) : [face(c)], uri: c.scryfall_uri || '' };
}
async function lookupCard(name, token) {
  const body = document.getElementById('cq-body');
  document.getElementById('cq-sugs').innerHTML = '';
  body.innerHTML = `<p class="hint">Looking up “${escapeHtml(name)}”…</p>`;
  try {
    let card;
    if (token) { const res = await sf(`/cards/search?q=${encodeURIComponent(`t:token include:extras !${sfQuote(name)}`)}&order=released&dir=desc`); card = res && res.data && res.data[0]; }
    else card = await sf(`/cards/named?exact=${encodeURIComponent(name)}`);
    if (!card) { body.innerHTML = `<p class="hint">Scryfall has no ${token ? 'token' : 'card'} named “${escapeHtml(name)}”.</p>`; return; }
    let rulings = [];
    if (card.rulings_uri && card.rulings_uri.startsWith(SF)) {
      const r = await sf(card.rulings_uri.slice(SF.length));
      rulings = ((r && r.data) || []).map(x => ({ date: x.published_at, text: x.comment, source: x.source }));
    }
    const entry = { ...trimCard(card), token: !!token, rulings, saved: Date.now() };
    cardCache = [entry, ...cardCache.filter(c => c.name !== entry.name)].slice(0, 30);
    saveJSON(CARDS_KEY, cardCache);
    rui.card = entry.name; renderCards();
  } catch (e) {
    const cached = cardCache.find(c => c.name.toLowerCase() === name.toLowerCase());
    if (cached) { rui.card = cached.name; renderCards(); toast('Offline: showing the saved copy of this card.', true); }
    else body.innerHTML = `<p class="hint">${offlineMsg}</p>`;
  }
}
function renderCards() {
  const body = document.getElementById('cq-body');
  const c = rui.card && cardCache.find(x => x.name === rui.card);
  if (c) {
    const kws = c.keywords.map(k => RULES && RX.kw.has(norm(k)) ? `<button class="tog" data-ref="r:${RX.kw.get(norm(k))}">${escapeHtml(k)} · ${RX.kw.get(norm(k))}</button>` : '').join('');
    body.innerHTML = `<div class="rbar"><button class="tog" data-cardback>Back</button><button class="tog" data-cite="card:${escapeHtml(c.name)}" data-label="Card: ${escapeHtml(c.name)}">Cite in dispute</button></div>
      <div class="rview">${c.faces.map(f => `<span class="crumb">${escapeHtml(f.type_line)}</span><h3>${escapeHtml(f.name)} <span class="credit">${escapeHtml(f.mana_cost)}</span></h3>
        <div class="card-oracle">${escapeHtml(f.oracle_text)}</div>${f.power !== undefined ? `<p class="credit">${escapeHtml(f.power)}/${escapeHtml(f.toughness)}</p>` : ''}${f.loyalty !== undefined ? `<p class="credit">Loyalty ${escapeHtml(f.loyalty)}</p>` : ''}`).join('')}
        ${kws ? `<div class="sec"><div class="lbl">Keyword rules</div><div class="toggles">${kws}</div></div>` : ''}
        <div class="sec"><div class="lbl">Official rulings (${c.rulings.length})</div>
        ${c.rulings.length ? c.rulings.slice().reverse().map((r, n) => `<div class="ruling"><p><small>${escapeHtml(r.date || '')}${r.source === 'wotc' ? ' · Wizards of the Coast' : ''}</small>${linkify(r.text)}</p>
          <button class="tog" data-cite="ruling:${escapeHtml(c.name)}:${c.rulings.length - 1 - n}" data-label="Ruling on ${escapeHtml(c.name)}">Cite</button></div>`).join('') : '<p class="hint">No official rulings for this card.</p>'}</div>
        <p class="hint">Card text and rulings from Scryfall.</p></div>`;
    return;
  }
  const names = [...new Set(state.players.flatMap(p => p.tokens.map(t => t.name)))];
  body.innerHTML = `${names.length ? `<div class="sec"><div class="lbl">Tokens on the board</div><div class="toggles">${names.map(n => `<button class="tog" data-tokcard="${escapeHtml(n)}">${escapeHtml(n)}</button>`).join('')}</div></div>` : ''}
    ${cardCache.length ? `<div class="sec"><div class="lbl">Recently viewed (saved for offline)</div><div class="rlist">${cardCache.map(x => `<button class="rres" data-savedcard="${escapeHtml(x.name)}"><b>${escapeHtml(x.name)}</b>${escapeHtml(x.faces[0].type_line)}<small>${x.rulings.length} ruling${x.rulings.length === 1 ? '' : 's'}</small></button>`).join('')}</div></div>` : ''}
    <p class="hint">Type a card name to see its exact Oracle text and official rulings. Looking up new cards needs internet.</p>`;
}
let cardQueryTimer = null;

/* Settle a dispute: organise the argument, cite evidence, record the decision */
const newDraft = () => ({ topic: '', cards: '', claims: ['', ''], evidence: [], winner: null, note: '', log: true });
function saveDraft() { saveJSON(DRAFT_KEY, draft); }
function cite(ref, label) {
  if (!draft) draft = newDraft();
  if (!draft.evidence.some(e => e.ref === ref)) draft.evidence.push({ ref, label });

  toast(`Added to the dispute: ${label}`, true);
}

  return `<button class="rlink" data-savedcard="${escapeHtml(name)}">${escapeHtml(e.label)}</button>`;
}

    <div class="toggles"><button class="tog" data-dgo="search">Search rules</button><button class="tog" data-dgo="cards">Look up a card</button><button class="tog" data-dgo="guides">Guides</button></div>
    <div class="lbl">Decision</div>

function saveRuling() {
  const msg = document.getElementById('d-msg');
  if (!draft.topic.trim()) { msg.textContent = 'Add the question first, so the ruling can be found later.'; document.getElementById('d-topic').focus(); return; }
  if (draft.winner === null) { msg.textContent = 'Pick a decision before saving.'; return; }
  const names = state.players.map(p => p.name);
  const decision = draft.winner === 'other' ? 'Something else' : `${names[draft.winner]} is right`;
  house.rulings.unshift({ id: uid(), date: new Date().toISOString().slice(0, 10), topic: draft.topic.trim(), cards: draft.cards.trim(),
    claims: [{ who: names[0], text: draft.claims[0] }, { who: names[1], text: draft.claims[1] }], decision, note: draft.note.trim(), evidence: draft.evidence });
  saveJSON(HOUSE_KEY, house);
  if (draft.log) { pushUndo(); addLog({ p: null, text: `Ruling: ${draft.topic.trim()} · ${decision}` }); commit(); }
  draft = newDraft(); saveDraft();
  toast('Ruling saved to House rulings.', true);
  switchRulesTab('house');
}

/* House rulings and house rules */
function renderHouse() {
  const body = document.getElementById('h-body');
  const q = norm((document.getElementById('hq') || {}).value || '');
  const list = house.rulings.filter(r => !q || norm([r.topic, r.cards, r.note, r.decision, ...r.claims.map(c => c.text)].join(' ')).includes(q));
  body.innerHTML = `<div class="dform">
    <input class="art-q" id="hq" type="search" value="${escapeHtml(q)}" placeholder="Search saved rulings" aria-label="Search saved rulings">
    <div class="lbl">Saved rulings (${house.rulings.length})</div>
    ${list.length ? list.map(r => `<div class="hr"><h4>${escapeHtml(r.topic)}</h4>
      <span class="dec">${escapeHtml(r.decision)}</span>${r.note ? `<span>${escapeHtml(r.note)}</span>` : ''}
      ${r.claims.filter(c => c.text).map(c => `<small><b>${escapeHtml(c.who)}:</b> ${escapeHtml(c.text)}</small>`).join('')}
      ${r.cards ? `<small>Cards: ${escapeHtml(r.cards)}</small>` : ''}
      ${r.evidence.length ? `<small>Evidence: ${r.evidence.map(evidenceLink).join(' · ')}</small>` : ''}
      <div class="rbar"><small>${escapeHtml(r.date)}</small><button class="tog danger" data-delruling="${r.id}">Delete</button></div></div>`).join('')
      : `<p class="hint">${house.rulings.length ? 'No saved ruling matches.' : 'Rulings you settle in “Settle a dispute” are saved here.'}</p>`}
    <div class="lbl">House rules</div>
    ${house.rules.map(r => `<div class="ev"><span>${escapeHtml(r.text)}</span><button class="x" data-delrule="${r.id}" aria-label="Delete house rule">×</button></div>`).join('') || '<p class="hint">Rules your group plays differently, e.g. “First mulligan is free in 1v1 Commander.”</p>'}
    <div class="kit-row"><input id="h-new" maxlength="200" autocomplete="off" placeholder="Add a house rule" aria-label="New house rule"><button class="tog" data-addrule>Add</button></div></div>`;
}

/* Rules screen wiring */
(() => {
  const sheet = document.getElementById('sheet-rules');
  document.getElementById('btn-rules').addEventListener('click', () => openRules());
  sheet.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const d = b.dataset;
    if (d.rtab) switchRulesTab(d.rtab);
    else if (d.ref) openRef(d.ref);
    else if ('back' in d) { rui.stack.pop(); renderSearch(); }
    else if (d.mark) { rprefs.marks = isMarked(d.mark) ? rprefs.marks.filter(x => x !== d.mark) : [d.mark, ...rprefs.marks]; saveJSON(NAV_KEY, rprefs); renderSearch(); }
    else if (d.cite) cite(d.cite, d.label);
    else if (d.cardname) { document.getElementById('cq').value = d.cardname; lookupCard(d.cardname, false); }
    else if (d.tokcard) lookupCard(d.tokcard, true);
    else if (d.savedcard) { rui.card = d.savedcard; switchRulesTab('cards'); }
    else if ('cardback' in d) { rui.card = null; renderCards(); }
    else if (d.guide) { rui.guide = d.guide; renderGuides(); }
    else if ('guideback' in d) { rui.guide = null; renderGuides(); }
    else if (d.dgo) switchRulesTab(d.dgo);
    else if (d.dwin) { draft.winner = d.dwin === 'other' ? 'other' : Number(d.dwin); saveDraft(); renderDispute(); }
    else if ('dlog' in d) { draft.log = !draft.log; saveDraft(); b.setAttribute('aria-pressed', String(draft.log)); }
    else if (d.unev) { draft.evidence.splice(Number(d.unev), 1); saveDraft(); renderDispute(); }
    else if ('dclear' in d) {
      if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Tap to clear'; setTimeout(() => { if (b.isConnected) { b.classList.remove('armed'); b.textContent = 'Clear'; } }, 3000); return; }
      draft = newDraft(); saveDraft(); renderDispute();
    }
    else if ('dsave' in d) saveRuling();
    else if (d.delruling) {
      if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Tap to delete'; setTimeout(() => { if (b.isConnected) { b.classList.remove('armed'); b.textContent = 'Delete'; } }, 3000); return; }
      house.rulings = house.rulings.filter(r => r.id !== d.delruling); saveJSON(HOUSE_KEY, house); renderHouse();
    }
    else if (d.delrule) { house.rules = house.rules.filter(r => r.id !== d.delrule); saveJSON(HOUSE_KEY, house); renderHouse(); }
    else if ('addrule' in d) {
      const inp = document.getElementById('h-new'), text = inp.value.trim();
      if (!text) { inp.focus(); return; }
      house.rules.push({ id: uid(), text }); saveJSON(HOUSE_KEY, house); renderHouse();
    }
  });
  sheet.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'rq') { rui.stack = []; renderSearch(); }
    else if (t.id === 'cq') cardQueryChanged(t.value);
    else if (t.id === 'gq') { rui.guide = null; renderGuides(); }
    else if (t.id === 'hq') { const at = t.selectionStart; renderHouse(); const n = document.getElementById('hq'); n.focus(); n.setSelectionRange(at, at); }
    else if (t.dataset.df) {
      const f = t.dataset.df;
      if (f === 'c0' || f === 'c1') draft.claims[Number(f[1])] = t.value; else draft[f] = t.value;
      saveDraft();
    }
  });
  sheet.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (e.target.id === 'cq') { e.preventDefault(); const v = e.target.value.trim(); if (v) lookupCard(v, false); }
    else if (e.target.id === 'rq') { e.preventDefault(); e.target.blur(); }
    else if (e.target.id === 'h-new') { e.preventDefault(); sheet.querySelector('[data-addrule]').click(); }
  });
})();

const announceEl = document.getElementById('announce');
let announceTimer = null;
function announce(big, small) {
  announceEl.querySelectorAll('[data-a="big"]').forEach(n => { n.textContent = big; });
  announceEl.querySelectorAll('[data-a="small"]').forEach(n => { n.textContent = small; });
  announceEl.hidden = false;
  announceEl.classList.remove('roll'); void announceEl.offsetWidth; announceEl.classList.add('roll');
  clearTimeout(announceTimer);
  announceTimer = setTimeout(() => { announceEl.hidden = true; }, 4000);
}
announceEl.addEventListener('click', () => { announceEl.hidden = true; });

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ---------- Keep the screen awake ---------- */
let wakeLock = null;
async function wake() {
  if (wakeLock || !('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (e) { wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });
document.addEventListener('pointerdown', wake, { passive: true });

// Stop iOS pinch and double-tap zoom from hijacking fast tapping
['gesturestart', 'gesturechange', 'dblclick'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));

/* ---------- Boot ---------- */
function start(hot) {
  state = (hot && hot.state) || load() || newState(null, 'commander', 40, 0);
  state.players.forEach(p => {
    if (!Array.isArray(p.tokens)) p.tokens = [];
    if (!Array.isArray(p.anthems)) p.anthems = [];
    if (p.kit === undefined) p.kit = null;
  });
  if (hot && hot.undo) undoStack = hot.undo;
  else if (!(hot && hot.state) && load()) undoStack = loadUndo();
  buildPanel(0); buildPanel(1);
  renderBg(0); renderBg(1);
  render();
  setInterval(renderClock, 1000);
  window.addEventListener('resize', () => { layoutHalf(0); layoutHalf(1); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layoutHalf(0); layoutHalf(1); });
}
window.claude?.hot?.snapshot?.(() => ({ state, undo: undoStack }));
if (window.claude?.hot?.ready) window.claude.hot.ready(start);
else start(window.claude?.hot?.data ?? {});

// Offline support when served from its own site (GitHub Pages)
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
